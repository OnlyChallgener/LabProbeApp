name: One-off build184 targeted UI polish

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build184-ui-polish.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply targeted build184 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} exact matches, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, expected))

          def regex(path, pattern, repl, expected=1, flags=re.S):
              text = read(path)
              new, count = re.subn(pattern, repl, text, count=expected, flags=flags)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} regex matches, got {count}: {pattern[:100]!r}')
              write(path, new)

          # 1) Version: 0.10.42 / build184.
          gradle = 'app/build.gradle.kts'
          exact(gradle, 'versionCode = 181\n        versionName = "0.10.39"', 'versionCode = 184\n        versionName = "0.10.42"')

          # 2) WOL header: smaller, still strong.
          wol = 'app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt'
          exact(
              wol,
              'Text("WOL 设备", fontSize = 16.5.sp, lineHeight = 19.sp, fontWeight = FontWeight.Black, color = LabV2.Ink)',
              'Text("WOL 设备", fontSize = 14.5.sp, lineHeight = 18.sp, fontWeight = FontWeight.Bold, color = LabV2.Ink)'
          )

          # 3) Global visual tokens: cleaner white/blue surfaces, less grey haze,
          #    and smaller-but-stronger title hierarchy instead of simply enlarging text.
          ui = 'app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt'
          replacements = {
              'val ShadowAmbient = Color(0x0F142033)': 'val ShadowAmbient = Color(0x0C3B82C4)',
              'val ShadowSpot = Color(0x17142033)': 'val ShadowSpot = Color(0x123B82C4)',
              'val BackgroundTop = Color(0xFFEAF3FF)': 'val BackgroundTop = Color(0xFFE8F4FF)',
              'val BackgroundMid = Color(0xFFF2F7FD)': 'val BackgroundMid = Color(0xFFF5FAFF)',
              'val CardTop = Color(0xFFFCFEFF)': 'val CardTop = Color(0xFFFFFFFF)',
              'val CardBottom = Color(0xFFF3F7FC)': 'val CardBottom = Color(0xFFFBFDFF)',
              'val FieldSoft = Color(0xFFF7FAFE)': 'val FieldSoft = Color(0xFFF6FAFF)',
              'val Border = Color(0xFFDDE7F2)': 'val Border = Color(0xFFD8E8F7)',
              'val BorderStrong = Color(0xFFCAD8E8)': 'val BorderStrong = Color(0xFFC4DCF2)',
              'val Inner = Color(0xFFF8FAFC)': 'val Inner = Color(0xFFF3F9FF)',
              'val Border = Color(0xFFE7EDF4)': 'val Border = Color(0xFFDDEAF6)',
              'fontSize = 22.sp,\n        lineHeight = 28.sp,\n        fontWeight = FontWeight.Bold,': 'fontSize = 20.sp,\n        lineHeight = 25.sp,\n        fontWeight = FontWeight.Bold,\n        letterSpacing = (-0.12).sp,',
              'fontSize = 20.sp,\n        lineHeight = 26.sp,\n        fontWeight = FontWeight.Bold,': 'fontSize = 18.sp,\n        lineHeight = 23.sp,\n        fontWeight = FontWeight.Bold,\n        letterSpacing = (-0.10).sp,',
              'fontSize = 16.sp,\n        lineHeight = 21.sp,\n        fontWeight = FontWeight.Bold,': 'fontSize = 15.sp,\n        lineHeight = 20.sp,\n        fontWeight = FontWeight.Bold,\n        letterSpacing = (-0.06).sp,',
              'fontSize = 14.sp,\n        lineHeight = 19.sp,\n        fontWeight = FontWeight.SemiBold,': 'fontSize = 13.5.sp,\n        lineHeight = 18.sp,\n        fontWeight = FontWeight.SemiBold,\n        letterSpacing = (-0.03).sp,',
          }
          text = read(ui)
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'{ui}: token match != 1 for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          text = text.replace('// Shared neutral elevation: no blue, white, or feature-colored shadows.', '// Shared cool-blue elevation: very light depth without grey square shadows.', 1)
          write(ui, text)

          # 4) Device card traffic grid: make the right-hand download icon start at
          #    exactly the same half-column as IPv6 / signal above it.
          main = 'app/src/main/kotlin/com/labprobe/app/MainActivity.kt'
          device_today = r'''@Composable
          fun DeviceTodayTrafficBar(d: DeviceItem) {
              val upload = cleanApiText(d.todayUpload)
              val download = cleanApiText(d.todayDownload)
              if (upload.isBlank() && download.isBlank()) return

              Row(
                  Modifier.fillMaxWidth().padding(vertical = 4.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          "今日流量",
                          modifier = Modifier.width(64.dp),
                          fontSize = LabTypography.Caption.fontSize,
                          fontWeight = FontWeight.Medium,
                          color = LabV2.InkMuted,
                          maxLines = 1,
                      )
                      DeviceTrafficDirection(
                          label = "上行",
                          value = upload.ifBlank { "--" },
                          icon = Icons.Rounded.ArrowUpward,
                          color = Color(0xFFF59E0B),
                          modifier = Modifier.weight(1f),
                      )
                  }
                  DeviceTrafficDirection(
                      label = "下行",
                      value = download.ifBlank { "--" },
                      icon = Icons.Rounded.ArrowDownward,
                      color = Color(0xFF06B6D4),
                      modifier = Modifier.weight(1f),
                  )
              }
          }

          @Composable
          private fun DeviceTrafficDirection'''
          regex(
              main,
              r'@Composable\nfun DeviceTodayTrafficBar\(d: DeviceItem\) \{.*?\n\}\n\n@Composable\nprivate fun DeviceTrafficDirection',
              device_today,
          )

          # 5) Router-control palette + mapping/connection icon unification.
          router = 'app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt'
          exact(router, 'private val RouterField = Color(0xFFF7F9FD)', 'private val RouterField = Color(0xFFFBFDFF)')
          exact(router, 'private val RouterBorder = Color(0xFFE4EAF3)', 'private val RouterBorder = Color(0xFFD9E8F7)')
          exact(router, 'private val RouterPage = Color(0xFFF5F8FD)', 'private val RouterPage = Color(0xFFF2F8FF)')

          mapping_block = '''            RouterGlyph.Mapping, RouterGlyph.Port -> {
                // One shared bidirectional mapping symbol across settings, IPv6 mapping and native port mapping.
                val left = w * .18f
                val right = w * .82f
                val upper = h * .36f
                val lower = h * .64f
                drawLine(color, Offset(left, upper), Offset(right, upper), stroke.width, StrokeCap.Round)
                drawLine(color, Offset(right - w * .13f, upper - h * .10f), Offset(right, upper), stroke.width, StrokeCap.Round)
                drawLine(color, Offset(right - w * .13f, upper + h * .10f), Offset(right, upper), stroke.width, StrokeCap.Round)
                drawLine(color, Offset(right, lower), Offset(left, lower), stroke.width, StrokeCap.Round)
                drawLine(color, Offset(left + w * .13f, lower - h * .10f), Offset(left, lower), stroke.width, StrokeCap.Round)
                drawLine(color, Offset(left + w * .13f, lower + h * .10f), Offset(left, lower), stroke.width, StrokeCap.Round)
            }
            RouterGlyph.Ddns -> {'''
          regex(
              router,
              r'            RouterGlyph\.Mapping, RouterGlyph\.Port -> \{.*?\n            \}\n            RouterGlyph\.Ddns -> \{',
              mapping_block,
          )

          connection_block = '''            RouterGlyph.Connection -> {
                // Shared double-lightning symbol for router-control health everywhere.
                fun bolt(cx: Float): Path = Path().apply {
                    moveTo(cx + w * .04f, h * .12f)
                    lineTo(cx - w * .09f, h * .50f)
                    lineTo(cx - w * .01f, h * .50f)
                    lineTo(cx - w * .06f, h * .88f)
                    lineTo(cx + w * .11f, h * .42f)
                    lineTo(cx + w * .02f, h * .42f)
                    close()
                }
                drawPath(bolt(w * .34f), color)
                drawPath(bolt(w * .66f), color)
            }
            RouterGlyph.Beta -> {'''
          regex(
              router,
              r'            RouterGlyph\.Connection -> \{.*?\n            \}\n            RouterGlyph\.Beta -> \{',
              connection_block,
          )
          exact(
              router,
              'RouterGlyphIcon(RouterGlyph.Port, RouterBlue, Modifier.size(20.dp))',
              'Icon(Icons.Rounded.CompareArrows, null, Modifier.size(20.dp), tint = RouterBlue)'
          )

          # 6) Same mapping icon on the IPv6-mapping Agent card and empty state.
          portmap = 'app/src/main/kotlin/com/labprobe/app/PortMapping.kt'
          text = read(portmap)
          count = text.count('Icons.Rounded.SwapHoriz')
          if count < 2:
              raise RuntimeError(f'{portmap}: expected >=2 SwapHoriz icons, got {count}')
          write(portmap, text.replace('Icons.Rounded.SwapHoriz', 'Icons.Rounded.CompareArrows'))

          # 7) Same double-lightning connection glyph on router settings and Hub-status page.
          settings = 'app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt'
          regex(
              settings,
              r'''                Box\(Modifier\.size\(23\.dp\)\) \{\s*Icon\(Icons\.Rounded\.Bolt, null, Modifier\.align\(Alignment\.CenterStart\)\.size\(16\.dp\), tint = accent\)\s*Icon\(Icons\.Rounded\.Bolt, null, Modifier\.align\(Alignment\.CenterEnd\)\.size\(16\.dp\), tint = accent\)\s*\}''',
              '                RouterGlyphIcon(RouterGlyph.Connection, accent, Modifier.size(23.dp))',
          )

          # 8) Favorite editor: make service type and DDNS association fields exactly
          #    the same height; router-native DDNS is an active selectable source.
          fav = 'app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt'
          regex(
              fav,
              r'(private fun RowScope\.FavoriteInlineField\(.*?CompactTextField\(.*?modifier = )Modifier\.weight\(1f\)(,)',
              r'\1Modifier.weight(1f).height(LabV2.FieldHeight)\2',
          )
          exact(
              fav,
              'colors = ButtonDefaults.outlinedButtonColors(contentColor = LabV2.Ink),\n                    ) {',
              'colors = ButtonDefaults.outlinedButtonColors(contentColor = LabV2.Ink),\n                        border = BorderStroke(1.dp, LabV2.BorderStrong),\n                        contentPadding = PaddingValues(horizontal = 12.dp, vertical = 0.dp),\n                    ) {'
          )
          helper_marker = 'private fun favoriteDdnsHostname(\n'
          text = read(fav)
          if helper_marker not in text:
              raise RuntimeError('favoriteDdnsHostname marker missing')
          helper = '''private fun routerDdnsHostname(record: DdnsRecord): String? {
              val raw = record.domain.trim()
              validFavoriteHostname(raw)?.let { return it }
              val at = raw.indexOf('@')
              if (at > 0 && at < raw.lastIndex) {
                  val rr = raw.substring(0, at).trim().trim('.')
                  val zone = raw.substring(at + 1).trim().trim('.')
                  validFavoriteHostname("$rr.$zone")?.let { return it }
              }
              return null
          }

          '''
          text = text.replace(helper_marker, helper + helper_marker, 1)
          old = '?: routerDdnsRecord(value, nativeDdnsRecords)?.domain?.let(::validFavoriteHostname)'
          if old not in text:
              raise RuntimeError('router DDNS favorite fallback marker missing')
          text = text.replace(old, '?: routerDdnsRecord(value, nativeDdnsRecords)?.let(::routerDdnsHostname)', 1)
          old = 'fun selectRouterDdns(record: DdnsRecord?) =\n        selectDdns(record?.let(::routerDdnsId), record?.domain)'
          if old not in text:
              raise RuntimeError('selectRouterDdns marker missing')
          text = text.replace(old, 'fun selectRouterDdns(record: DdnsRecord?) =\n        selectDdns(record?.let(::routerDdnsId), record?.let(::routerDdnsHostname))', 1)
          old = 'Text(record.domain, color = LabV2.InkMuted, maxLines = 1, overflow = TextOverflow.Ellipsis)'
          if old not in text:
              raise RuntimeError('router DDNS menu text marker missing')
          text = text.replace(old, 'Text(record.domain, color = LabV2.Ink, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)', 1)
          write(fav, text)

          # 9) Launcher: keep the foreground scale/geometry exactly as-is, only add
          #    stronger teal-to-blue depth and a soft highlight to the background.
          launcher_bg = Path('app/src/main/res/drawable/ic_launcher_background.xml')
          launcher_bg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0H108V108H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="4"
                          android:startY="2"
                          android:endX="104"
                          android:endY="106"
                          android:type="linear">
                          <item android:color="#FF76DDD3" android:offset="0" />
                          <item android:color="#FF53C8CC" android:offset="0.38" />
                          <item android:color="#FF36B2C5" android:offset="0.72" />
                          <item android:color="#FF259BB8" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0H108V108H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:centerX="32"
                          android:centerY="26"
                          android:gradientRadius="82"
                          android:type="radial">
                          <item android:color="#30FFFFFF" android:offset="0" />
                          <item android:color="#10FFFFFF" android:offset="0.46" />
                          <item android:color="#00FFFFFF" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          ''', encoding='utf-8')

          # Sanity assertions for every user-visible requirement.
          checks = {
              gradle: ['versionCode = 184', 'versionName = "0.10.42"'],
              wol: ['fontSize = 14.5.sp', 'fontWeight = FontWeight.Bold'],
              main: ['Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically)', 'label = "下行"'],
              portmap: ['Icons.Rounded.CompareArrows'],
              router: ['Shared double-lightning symbol', 'Icons.Rounded.CompareArrows'],
              settings: ['RouterGlyphIcon(RouterGlyph.Connection'],
              fav: ['routerDdnsHostname', 'Modifier.weight(1f).height(LabV2.FieldHeight)', 'color = LabV2.Ink, fontWeight = FontWeight.SemiBold'],
              ui: ['fontSize = 18.sp', 'fontSize = 15.sp', 'Color(0xFFF3F9FF)'],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'{path}: missing final assertion {needle!r}')

          print('build184 targeted source patch applied')
          PY

          git diff --check

      - name: Test and assemble debug
        shell: bash
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain > /tmp/build184.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "build_rc=$rc"
              echo "---- git diff --check ----"
              git diff --check || true
              echo "---- build log tail ----"
              tail -n 260 /tmp/build184.log
            } > .build184-failure.txt
            git config user.name "OpenAI UI Fix"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .build184-failure.txt
            git commit -m "chore: record build184 UI compile failure"
            git pull --rebase origin release/build180
            git push origin HEAD:release/build180
            exit 1
          fi
          echo "testDebugUnitTest + assembleDebug passed"

      - name: Commit validated source and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .build184-failure.txt
          git rm .github/workflows/oneoff-build184-ui-polish.yml
          git add app
          git diff --cached --check
          git commit -m "fix: polish build184 UI consistency and DDNS linking"
          git pull --rebase origin release/build180
          git push origin HEAD:release/build180
