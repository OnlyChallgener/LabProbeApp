name: One-off build184 final UI polish

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build184-ui-polish.yml
      - scripts/oneoff_build184_patch.py

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.10.42 targeted fixes
        run: |
          set -euo pipefail
          python3 scripts/oneoff_build184_patch.py
          git diff --check

      - name: Unit test and assemble debug
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain > /tmp/build184.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "build_rc=$rc"
              echo "---- git diff --check ----"
              git diff --check || true
              echo "---- build log tail ----"
              tail -n 300 /tmp/build184.log
            } > .build184-failure.txt
            git config user.name "OpenAI UI Fix"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .build184-failure.txt
            git commit -m "chore: record build184 compile failure"
            git pull --rebase origin release/build180
            git push origin HEAD:release/build180
            exit 1
          fi
          echo "testDebugUnitTest + assembleDebug passed"

      - name: Commit validated v0.10.42 source
        run: |
          set -euo pipefail
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .build184-failure.txt
          git rm .github/workflows/oneoff-build184-ui-polish.yml scripts/oneoff_build184_patch.py
          git add app
          git diff --cached --check
          git commit -m "fix: polish v0.10.42 UI consistency and DDNS linking"
          git pull --rebase origin release/build180
          git push origin HEAD:release/build180
