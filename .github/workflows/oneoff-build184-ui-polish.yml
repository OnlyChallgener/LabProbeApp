name: One-off build184 final UI polish

on:
  pull_request:
    branches:
      - release/build180

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply and verify final v0.10.42 UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def require(path, needle):
              if needle not in read(path):
                  raise RuntimeError(f'{path}: missing {needle!r}')

          gradle = 'app/build.gradle.kts'
          require(gradle, 'versionCode = 184')
          require(gradle, 'versionName = "0.10.42"')

          wol = 'app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt'
          require(wol, 'Text("WOL 设备", fontSize = 14.5.sp')

          ui = 'app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt'
          text = read(ui)
          if 'HomeMiniMetric = Metric.copy(fontSize = 25.sp' not in text:
              old = 'val HomeMiniMetric = Metric.copy(fontSize = 28.sp, lineHeight = 32.sp)'
              if old not in text:
                  raise RuntimeError('HomeMiniMetric old/final marker missing')
              text = text.replace(old, 'val HomeMiniMetric = Metric.copy(fontSize = 25.sp, lineHeight = 29.sp, fontWeight = FontWeight.Bold)', 1)
              write(ui, text)
          require(ui, 'fontSize = 18.sp')
          require(ui, 'fontSize = 15.sp')
          require(ui, 'val Inner = Color(0xFFF3F9FF)')

          main = 'app/src/main/kotlin/com/labprobe/app/MainActivity.kt'
          text = read(main)
          # Device card right column: align download icon/value with IPv6/signal column.
          if 'modifier = Modifier.width(64.dp)' not in text or 'label = "下行"' not in text:
              pattern = r'@Composable\nfun DeviceTodayTrafficBar\(d: DeviceItem\) \{.*?\n\}\n\n@Composable\nprivate fun DeviceTrafficDirection'
              replacement = r'''@Composable
          fun DeviceTodayTrafficBar(d: DeviceItem) {
              val upload = cleanApiText(d.todayUpload)
              val download = cleanApiText(d.todayDownload)
              if (upload.isBlank() && download.isBlank()) return

              Row(
                  Modifier.fillMaxWidth().padding(vertical = 4.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Row(Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          "今日流量",
                          modifier = Modifier.width(64.dp),
                          fontSize = LabTypography.Caption.fontSize,
                          fontWeight = FontWeight.Medium,
                          color = LabV2.InkMuted,
                          maxLines = 1,
                      )
                      DeviceTrafficDirection(
                          label = "上行",
                          value = upload.ifBlank { "--" },
                          icon = Icons.Rounded.ArrowUpward,
                          color = Color(0xFFF59E0B),
                          modifier = Modifier.weight(1f),
                      )
                  }
                  DeviceTrafficDirection(
                      label = "下行",
                      value = download.ifBlank { "--" },
                      icon = Icons.Rounded.ArrowDownward,
                      color = Color(0xFF06B6D4),
                      modifier = Modifier.weight(1f),
                  )
              }
          }

          @Composable
          private fun DeviceTrafficDirection'''
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'DeviceTodayTrafficBar replacement count={count}')
              write(main, text2)
          require(main, 'border = null')
          require(main, 'vertical = 8.dp')
          require(main, 'Modifier.size(124.dp).clickable { onNavigate("health_score") }')

          router = 'app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt'
          require(router, 'One shared bidirectional mapping symbol across settings, IPv6 mapping and native port mapping.')
          require(router, 'Shared double-lightning symbol for router-control health everywhere.')
          require(router, 'Icon(Icons.Rounded.CompareArrows, null, Modifier.size(20.dp), tint = RouterBlue)')

          portmap = 'app/src/main/kotlin/com/labprobe/app/PortMapping.kt'
          require(portmap, 'Icons.Rounded.CompareArrows')

          settings = 'app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt'
          require(settings, 'RouterGlyphIcon(RouterGlyph.Connection, accent, Modifier.size(23.dp))')

          fav = 'app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt'
          text = read(fav)
          # Make service type input and DDNS association selector share exactly the same field height.
          start = text.index('private fun RowScope.FavoriteInlineField(')
          end = text.index('\n}\n\n', start) + 2
          func = text[start:end]
          if 'height(LabV2.FieldHeight)' not in func:
              old = 'modifier = Modifier.weight(1f),'
              if old not in func:
                  raise RuntimeError('FavoriteInlineField modifier marker missing')
              func = func.replace(old, 'modifier = Modifier.weight(1f).height(LabV2.FieldHeight),', 1)
              text = text[:start] + func + text[end:]
              write(fav, text)
          require(fav, 'private fun routerDdnsHostname(record: DdnsRecord): String?')
          require(fav, 'routerDdnsRecord(value, nativeDdnsRecords)?.let(::routerDdnsHostname)')
          require(fav, 'selectDdns(record?.let(::routerDdnsId), record?.let(::routerDdnsHostname))')
          require(fav, 'Modifier.weight(1f).height(LabV2.FieldHeight)')

          launcher = 'app/src/main/res/drawable/ic_launcher_background.xml'
          require(launcher, '#FF76DDD3')
          require(launcher, '#FF259BB8')

          print('final v0.10.42 source checks passed')
          PY
          git diff --check

      - name: Unit test and assemble debug
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Commit the exact validated source to PR head
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build184-validation-trigger.txt
          git add app
          git add -u build184-validation-trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source diff to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: finalize v0.10.42 UI polish"
          git push origin HEAD:"$HEAD_BRANCH"
