name: One-off build184 final UI polish

on:
  pull_request:
    branches:
      - release/build180

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.10.42 targeted source fixes
        run: |
          set -euo pipefail
          python3 scripts/oneoff_build184_patch.py
          git diff --check

      - name: Unit test and assemble debug
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Commit the exact validated source to PR head
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build184-validation-trigger.txt
          git add app
          git add -u build184-validation-trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source diff to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: finalize v0.10.42 UI polish"
          git push origin HEAD:"$HEAD_BRANCH"
