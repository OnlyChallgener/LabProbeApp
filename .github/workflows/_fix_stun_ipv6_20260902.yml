name: Fix STUN port and IPv6 priority

on:
  push:
    branches:
      - fix/stun-port-ipv6-priority-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Apply patch
        run: python3 tools/_fix_stun_ipv6_20260902.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          gradle :app:testDebugUnitTest --tests com.labprobe.app.StunModelTest --tests com.labprobe.app.Ipv6UtilsTest :app:compileDebugKotlin --stacktrace --console=plain

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/labprobe/app/StunPenetration.kt app/src/main/kotlin/com/labprobe/app/Ipv6Utils.kt app/src/test/kotlin/com/labprobe/app/StunModelTest.kt app/src/test/kotlin/com/labprobe/app/Ipv6UtilsTest.kt
          git commit -m "fix(stun): show middle port and prefer usable compact IPv6"
          git push origin HEAD:fix/stun-port-ipv6-priority-20260902
