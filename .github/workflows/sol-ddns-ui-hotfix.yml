name: One-shot DDNS UI Hotfix Validate

on:
  push:
    branches:
      - build163
    paths:
      - '.github/workflows/sol-ddns-ui-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: sol-ddns-ui-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build163
          fetch-depth: 0

      - name: Apply narrow DDNS UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui_path = Path('app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt')
          ui = ui_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          ui = replace_once(
              ui,
              '''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                CompactSegment("LabProbe DDNS", area == 0, Modifier.weight(1f)) { area = 0 }
                CompactSegment("路由器原生 DDNS", area == 1, Modifier.weight(1f)) { area = 1 }
            }
            CompactSegment("证书监控", area == 2, Modifier.fillMaxWidth()) { area = 2 }''',
              '''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                CompactSegment("LabProbe DDNS", area == 0, Modifier.weight(1f)) { area = 0 }
                CompactSegment("路由器原生 DDNS", area == 1, Modifier.weight(1f)) { area = 1 }
                CompactSegment("证书监控", area == 2, Modifier.weight(1f)) { area = 2 }
            }''',
              'three top-level DDNS sections',
          )

          ui = replace_once(
              ui,
              '''    return when {
        value.startsWith("default-route:") -> "默认出口 ${value.removePrefix("default-route:")}"
        value.startsWith("delegated-lan:") -> "委派前缀 ${value.removePrefix("delegated-lan:")}"
        value.startsWith("generic:") -> "通用接口 ${value.removePrefix("generic:")}"
        else -> value
    }''',
              '''    return when {
        value.startsWith("egress-http:") -> "公网出口 ${value.removePrefix("egress-http:")}"
        value.startsWith("route-src:") -> "路由出口 ${value.removePrefix("route-src:")}"
        value.startsWith("default-route:") -> "默认出口 ${value.removePrefix("default-route:")}"
        value.startsWith("delegated-lan:") -> "委派前缀 ${value.removePrefix("delegated-lan:")}"
        value.startsWith("generic:") -> "通用接口 ${value.removePrefix("generic:")}"
        else -> value
    }''',
              'egress source localization',
          )

          ui = replace_once(
              ui,
              '''    var menu by remember { mutableStateOf(false) }
    BackHandler(onBack = onBack)''',
              '''    var menu by remember { mutableStateOf(false) }
    val detectedIpv4 = record.detectedIpv4.ifBlank { address.detectedIpv4 }
    val detectedIpv6 = record.detectedIpv6.ifBlank { address.detectedIpv6 }
    val hasDetectedAddress =
        (record.recordTypes.contains("A") && detectedIpv4.isNotBlank()) ||
            (record.recordTypes.contains("AAAA") && detectedIpv6.isNotBlank())
    BackHandler(onBack = onBack)''',
              'update eligibility state',
          )

          ui = replace_once(
              ui,
              'Button(onClick = onUpdateNow, enabled = !busy && record.enabled,',
              'Button(onClick = onUpdateNow, enabled = !busy && record.enabled && hasDetectedAddress,',
              'disable update without detected address',
          )

          ui_path.write_text(ui, encoding='utf-8')

          settings_path = Path('app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt')
          settings = settings_path.read_text(encoding='utf-8')
          settings = replace_once(
              settings,
              'LabProbe DDNS · 路由器原生 DDNS · 证书提醒',
              'LabProbe DDNS · 路由器原生 DDNS · 证书监控',
              'settings DDNS subtitle',
          )
          settings_path.write_text(settings, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "OpenAI Sol"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt
          git rm .github/workflows/sol-ddns-ui-hotfix.yml
          git commit -m "fix: finalize DDNS Chinese UI and three-section navigation"
          git push origin HEAD:build163

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Test and compile Android
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          python3 scripts/prepare_android_sources_build167.py
          python3 scripts/verify_build154_sources.py
          gradle :app:testDebugUnitTest :app:compileReleaseKotlin :app:assembleDebug --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-DDNS-UI-validation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
