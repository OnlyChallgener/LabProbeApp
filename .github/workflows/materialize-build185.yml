name: Materialize build185 expressive UI polish

on:
  push:
    branches: [release/build180]
    paths:
      - '.github/workflows/materialize-build185.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply build185 source polish
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_build185_expressive_ui_polish.py
          python3 scripts/apply_build185_expressive_ui_polish.py
          git diff --check

      - name: Verify final markers
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 185' app/build.gradle.kts
          grep -Fq 'versionName = "0.10.42"' app/build.gradle.kts
          grep -Fq 'HomeMiniMetric = Metric.copy(fontSize = 22.sp, lineHeight = 25.sp, fontWeight = FontWeight.ExtraBold)' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          grep -Fq 'val Purple = Cyan' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          ! grep -Fq 'FontFamily.SansSerif' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          grep -Fq 'if (index > 0) Spacer(Modifier.height(5.dp))' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'Color(0xFF7C3AED)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'leadingIcon = Icons.Rounded.Tune' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'NativeFirmwareVersionRow' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'containerColor=RouterCyan' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -Fq '"connection closed" in lower' app/src/main/kotlin/com/labprobe/app/UiMessageZh.kt

      - name: Commit materialized app sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/kotlin/com/labprobe/app/MainActivity.kt \
            app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt \
            app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt \
            app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          if git diff --cached --quiet; then
            echo 'No materialized source changes needed'
            exit 0
          fi
          git commit -m 'fix: expressive UI polish for build185'
          git push origin HEAD:release/build180
