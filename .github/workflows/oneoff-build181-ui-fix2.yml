name: One-off build181 mapping UI root fix

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-ui-fix2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0
      - name: Patch mapping pager
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace(
              'app/src/main/kotlin/com/labprobe/app/MainActivity.kt',
              '''fun DetailShell(
              title: String,
              subtitle: String,
              onBack: () -> Unit,
              compactHeader: Boolean = false,
              unifiedTypography: Boolean = false,
              content: @Composable ColumnScope.() -> Unit
          ) {''',
              '''fun DetailShell(
              title: String,
              subtitle: String,
              onBack: () -> Unit,
              compactHeader: Boolean = false,
              unifiedTypography: Boolean = false,
              showHeader: Boolean = true,
              content: @Composable ColumnScope.() -> Unit
          ) {'''
          )
          replace(
              'app/src/main/kotlin/com/labprobe/app/MainActivity.kt',
              '''    ) {
                  CompactPageHeader(
                      title = title,
                      subtitle = subtitle,
                      onBack = onBack,
                      compactTitle = compactHeader,
                      titleStyle = LabTypography.PageTitle.takeIf { unifiedTypography },
                      subtitleStyle = LabTypography.Supporting.takeIf { unifiedTypography }
                  )
                  content()
                  Spacer(Modifier.height(2.dp))
              }
          }

          @Composable
          fun OneUiTopNav''',
              '''    ) {
                  if (showHeader) {
                      CompactPageHeader(
                          title = title,
                          subtitle = subtitle,
                          onBack = onBack,
                          compactTitle = compactHeader,
                          titleStyle = LabTypography.PageTitle.takeIf { unifiedTypography },
                          subtitleStyle = LabTypography.Supporting.takeIf { unifiedTypography }
                      )
                  }
                  content()
                  Spacer(Modifier.height(2.dp))
              }
          }

          @Composable
          fun OneUiTopNav'''
          )
          replace(
              'app/src/main/kotlin/com/labprobe/app/PortMapping.kt',
              'fun PortMappingScreen(prefs: AppPrefs, onBack: () -> Unit) {',
              'fun PortMappingScreen(prefs: AppPrefs, onBack: () -> Unit, embedded: Boolean = false) {'
          )
          replace(
              'app/src/main/kotlin/com/labprobe/app/PortMapping.kt',
              'DetailShell("端口映射", "IPv6 入口 · Rust 四层反代 · 6→4 / 6→6", onBack, unifiedTypography = true) {',
              'DetailShell("端口映射", "IPv6 入口 · Rust 四层反代 · 6→4 / 6→6", onBack, unifiedTypography = true, showHeader = !embedded) {'
          )
          replace(
              'app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt',
              '''@Composable
          private fun LegacyIpv6MappingPage(prefs: AppPrefs, onBack: () -> Unit) {
              Box(Modifier.fillMaxSize().clipToBounds()) {
                  Box(Modifier.fillMaxSize().offset(y = (-62).dp)) {
                      PortMappingScreen(prefs = prefs, onBack = onBack)
                  }
              }
          }''',
              '''@Composable
          private fun LegacyIpv6MappingPage(prefs: AppPrefs, onBack: () -> Unit) {
              PortMappingScreen(prefs = prefs, onBack = onBack, embedded = true)
          }'''
          )
          replace(
              'app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt',
              '''@Composable
          private fun RouterSuiteTabs(selected: Int, onSelect: (Int) -> Unit) {
              val titles = listOf("IPv6映射", "端口映射", "UPnP")
              Row(Modifier.fillMaxWidth().height(36.dp).padding(horizontal = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                  titles.forEachIndexed { index, title ->
                      Box(Modifier.weight(1f).fillMaxHeight().clickable { onSelect(index) }, contentAlignment = Alignment.Center) {
                          Text(title, fontSize = LabTypography.Value.fontSize, fontWeight = if (selected == index) FontWeight.SemiBold else FontWeight.SemiBold, color = if (selected == index) RouterBlue else RouterMuted)
                          if (selected == index) Box(Modifier.align(Alignment.BottomCenter).width(30.dp).height(2.2.dp).background(RouterBlue, RoundedCornerShape(99.dp)))
                      }
                  }
              }
          }''',
              '''@Composable
          private fun RouterSuiteTabs(selected: Int, onSelect: (Int) -> Unit) {
              val titles = listOf("IPv6映射", "端口映射", "UPnP")
              Row(
                  Modifier.fillMaxWidth().height(42.dp).padding(horizontal = 12.dp, vertical = 3.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  titles.forEachIndexed { index, title ->
                      val active = selected == index
                      Surface(
                          onClick = { onSelect(index) },
                          modifier = Modifier.weight(1f).fillMaxHeight(),
                          shape = RoundedCornerShape(14.dp),
                          color = if (active) Color(0xFFE8F1FF) else Color.Transparent,
                          tonalElevation = 0.dp,
                          shadowElevation = 0.dp,
                          border = if (active) BorderStroke(1.dp, RouterBlue.copy(alpha = .12f)) else null
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(
                                  title,
                                  style = LabTypography.Value.copy(
                                      fontWeight = FontWeight.SemiBold,
                                      color = if (active) RouterBlue else RouterMuted
                                  ),
                                  maxLines = 1
                              )
                          }
                      }
                  }
              }
          }'''
          )
          PY
          git diff --check
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/labprobe/app/MainActivity.kt app/src/main/kotlin/com/labprobe/app/PortMapping.kt app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          git commit -m "fix: remove mapping clipping and square tab feedback"
          git rm .github/workflows/oneoff-build181-ui-fix.yml .github/workflows/oneoff-build181-ui-fix2.yml
          git commit -m "chore: remove one-off UI workflows"
          git push origin HEAD:release/build180
