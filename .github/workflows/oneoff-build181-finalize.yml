name: One-off build181 finalize

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Materialize release sources and protect current UI
        shell: bash
        run: |
          set -e
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 scripts/prepare_android_sources_build167.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/kotlin/com/labprobe/app/MainActivity.kt').read_text(encoding='utf-8')
          port=Path('app/src/main/kotlin/com/labprobe/app/PortMapping.kt').read_text(encoding='utf-8')
          control=Path('app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt').read_text(encoding='utf-8')
          settings=Path('app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt').read_text(encoding='utf-8')
          native=Path('app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt').read_text(encoding='utf-8')
          access=Path('app/src/main/kotlin/com/labprobe/app/ServiceAccess.kt').read_text(encoding='utf-8')
          fav=Path('app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt').read_text(encoding='utf-8')
          ui=Path('app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt').read_text(encoding='utf-8')

          checks=[
              ('.clickable(enabled = real.isNotBlank()) { copy(ctx, real) }' in main, 'home row click copy'),
              ('val stroke = if (size > 100.dp) 12.dp.toPx() else 11.dp.toPx()' in main, 'thicker health gauge'),
              ('showHeader: Boolean = true' in main, 'embedded detail shell'),
              ('embedded: Boolean = false' in port and 'showHeader = !embedded' in port, 'embedded IPv6 mapping'),
              ('offset(y = (-62).dp)' not in control, 'removed -62dp clipping'),
              ('Color(0xFFE8F1FF)' in control, 'pale blue rounded pager tabs'),
              ('icon = Icons.Rounded.CompareArrows' in settings, 'mapping bidirectional icon'),
              (settings.count('Icons.Rounded.Bolt') >= 2, 'dual lightning control icon'),
              ('Box(Modifier.weight(1.35f))' in native and native.count('modifier = Modifier.weight(.85f)') >= 2, 'matched STUN columns'),
              ('tcpReachableBeforeHttp' in access and '可继续用浏览器尝试' in access, 'HTTPS TCP fallback'),
              ('快速检测未确认，继续在浏览器尝试' in fav, 'browser forced try'),
          ]
          row=main[main.index('fun HealthDataRowDisplay'):main.index('@Composable\nfun HealthExitCard')]
          checks.append(('ContentCopy' not in row and 'IconButton(' not in row, 'removed trailing copy icon'))
          exit_card=main[main.index('fun HealthExitCard'):main.index('@Composable\nfun HealthVpnCard')]
          vpn_card=main[main.index('fun HealthVpnCard'):main.index('@Composable\nfun HealthDevicesCard')]
          checks.append(('HealthCard(Modifier.clip(HomeCardShape).clickable' not in exit_card, 'no exit-card jump'))
          checks.append(('HealthCard(Modifier.clip(HomeCardShape).clickable' not in vpn_card, 'no VPN-card jump'))
          card=ui[ui.index('val CardTitle = TextStyle('):ui.index('val SectionTitle = TextStyle(')]
          checks.append(('fontSize = 16.sp' in card and 'fontWeight = FontWeight.Bold' in card, 'strong CardTitle'))
          failed=[name for ok,name in checks if not ok]
          if failed:
              raise SystemExit('UI regression after source prepare: '+', '.join(failed))
          print('all requested UI/access markers preserved')
          PY

          git add app scripts
          git commit -m "fix: materialize build181 release source state"

          # This is the critical regression check: now it must be a true no-op.
          python3 scripts/prepare_android_sources_build167.py
          git diff --exit-code
          python3 scripts/verify_build154_sources.py

      - name: Test and build debug APK
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Clean temporary diagnostics and publish
        shell: bash
        run: |
          rm -f .build181-validation.txt .build181-prepare.diff .build181-materialize-check.txt .build181-materialize-failure.txt .build181-build-failure.txt
          git rm -f .github/workflows/oneoff-build181-validate.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-diagnose.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-prepdiff.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-materialize.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-materialize-check.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-finalize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: clean build181 one-off validation files"
          fi
          git push origin HEAD:release/build180
