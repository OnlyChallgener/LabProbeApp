name: Android Material Reference Screens

on:
  push:
    branches: [codex/ui-material-polish]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-material-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check reference-screen scope and frozen layout
        run: python tools/check_material_reference_ui.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: android-actions/setup-android@v3
      - name: Install hosted Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, test, and render reference screenshots
        run: gradle :app:assembleDebug :app:testDebugUnitTest -PmaterialScreenshots=true --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labprobe-material-reference
          path: |
            app/build/outputs/roborazzi/**
            app/build/reports/tests/**
            app/build/test-results/**
      - uses: actions/upload-artifact@v4
        with:
          name: labprobe-material-debug-apk
          path: app/build/outputs/apk/debug/*.apk
