name: Build165 Stage

on:
  push:
    branches: [build163]
  pull_request:
    branches: [build162]
  workflow_dispatch:

concurrency:
  group: build165-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare build165 generated sources
        run: python3 scripts/prepare_android_sources_build165.py
      - name: Verify build165 NAT, Agent, mapping and home fixes
        run: |
          exec > >(tee /tmp/build165-verify.log) 2>&1
          set -ex
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 165' app/build.gradle.kts
          grep -q 'versionName = "0.10.23"' app/build.gradle.kts
          grep -q 'NAT 诊断、Agent 更新与映射界面修复' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'requestAgentUpdateCheck()' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '"/api/agent/update/check"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'agentUpdateUiError' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'item.route == "tool_ssh"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'Color(0xFFE9EDF3)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val thresholdPx = with(LocalDensity.current) { 72.dp.toPx() }' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val syncLabel = if (snapshot.source.startsWith("已同步")) "实时同步" else "本地缓存"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'kotlinx.coroutines.withTimeoutOrNull(2_500L)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'HealthCard(Modifier.clickable { onClick() })' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'NativeValueRow("最终响应", "已收到")' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'RoundedCornerShape(24.dp)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'Text("STUN 服务器", fontSize = 9.sp' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'Text("STUN 端口", fontSize = 9.sp' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'onClick = onEdit' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'DialogProperties(usePlatformDefaultWidth = false)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'fillMaxSize().statusBarsPadding().navigationBarsPadding().imePadding()' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -q '来源：全部公网地址' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -q 'fillMaxWidth().fillMaxHeight(.86f)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabProbe-build165-verify-log
          path: /tmp/build165-verify.log
          if-no-files-found: ignore
      - name: Compile debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.23-build165-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.23-build165-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build165-generated-sources
          path: app/src/main/kotlin/com/labprobe/app
