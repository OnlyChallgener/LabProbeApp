name: Build163 Stage

on:
  push:
    branches: [build163]
  pull_request:
    branches: [build162]
  workflow_dispatch:

concurrency:
  group: build163-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare generated sources
        run: python3 scripts/prepare_android_sources.py
      - name: Verify five-second terminal snapshot merge
        run: |
          exec > >(tee /tmp/build163-verify.log) 2>&1
          set -ex
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 163' app/build.gradle.kts
          grep -q 'versionName = "0.10.21"' app/build.gradle.kts
          grep -q 'private val onDevicesSnapshot: (String) -> Unit = {}' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q '"devices_snapshot" -> if (data != null) onDevicesSnapshot(data.toString())' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q 'private fun acceptDevicesSnapshot(raw: String)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'lastDevicesSnapshotEpoch' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'root.optBoolean("confirmedEmpty", false)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'refreshOfflineDevices(offlineDevices + disappeared, fresh)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '终端列表五秒实时同步' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabProbe-build163-verify-log
          path: /tmp/build163-verify.log
          if-no-files-found: ignore
      - name: Compile debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.21-build163-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.21-build163-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build163-generated-sources
          path: app/src/main/kotlin/com/labprobe/app
