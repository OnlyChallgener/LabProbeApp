name: Build167 Stage

on:
  push:
    branches: [build163]
  pull_request:
    branches: [build162]
  workflow_dispatch:

concurrency:
  group: build166-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare build168 generated sources
        run: python3 scripts/prepare_android_sources_build167.py
      - name: Verify build168 home and mapping fixes
        run: |
          exec > >(tee /tmp/build166-verify.log) 2>&1
          set -ex
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 168' app/build.gradle.kts
          grep -q 'versionName = "0.10.26"' app/build.gradle.kts
          grep -q '首页视觉与映射状态修复' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '"网络健康得分",' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'softWrap = false' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'HealthShortcutTile(Icons.Rounded.Terminal, "SSH", "进入", Color(0xFF64748B)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'HealthShortcutTile(Icons.Rounded.Terminal, "SSH", "进入", LabV2.Purple' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'onClick: (() -> Unit)? = null' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val techBlue = Color(0xFF2D63D8)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'spotColor = techBlue.copy(alpha = .28f)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'modifier = modifier,' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'onClick = onClick' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'Agent 在线，正在重新获取映射运行状态' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'rule.syncState == "stale"' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'Agent 在线 · 正在重新获取运行状态' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'kotlinx.coroutines.withTimeout(4_000L)' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'requestAgentUpdateCheck()' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'NativeValueRow("最终响应", "已收到")' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'DialogProperties(usePlatformDefaultWidth = false)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -q '来源：全部公网地址' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabProbe-build166-verify-log
          path: /tmp/build166-verify.log
          if-no-files-found: ignore
      - name: Compile debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.24-build166-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.24-build166-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build166-generated-sources
          path: app/src/main/kotlin/com/labprobe/app
