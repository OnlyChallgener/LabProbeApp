name: One-shot firewall and WireGuard test prerelease

on:
  push:
    branches:
      - fix/firewall-order-wireguard-disabled-state
    paths:
      - .github/workflows/one-shot-test-prerelease.yml

permissions:
  contents: write

jobs:
  build-and-prerelease:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firewall-order-wireguard-disabled-state
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Resolve test version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          TEST_TAG="test-v${VERSION_NAME}-build${VERSION_CODE}-firewall-wg-20260902-1"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TEST_TAG=$TEST_TAG" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}-firewall-wg-test
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ASSET="LabProbe-v${VERSION_NAME}-build${VERSION_CODE}-firewall-wg-test.apk"
          cp "$APK" "$RUNNER_TEMP/$ASSET"
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<'EOF'
          测试范围：
          - 防火墙规则拖动排序：Material 3 拖动把手、抬升/缩放动画、边缘自动滚动、真实后端排序持久化。
          - WireGuard 网关关闭状态：停止旧客户端 tunnel，不再用旧握手时间显示“已握手”。

          注意：这是修复分支测试版，未合并 main，不作为正式发布版本。
          EOF
          if gh release view "$TEST_TAG" >/dev/null 2>&1; then
            gh release upload "$TEST_TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TEST_TAG" "$RUNNER_TEMP/$ASSET" \
              --target "$GITHUB_SHA" \
              --title "极客网探 v${VERSION_NAME} build${VERSION_CODE} 测试版 · 防火墙排序 / WireGuard" \
              --notes-file "$NOTES" \
              --prerelease
          fi
