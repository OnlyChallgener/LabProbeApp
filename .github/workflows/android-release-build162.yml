name: Android Release APK build162

on:
  workflow_dispatch:

concurrency:
  group: android-release-build162-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare fixed signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$LABPROBE_KEYSTORE_BASE64" || { echo "::error::LABPROBE_KEYSTORE_BASE64 is not configured."; exit 1; }
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"
      - name: Prepare final Android sources once
        run: python3 scripts/prepare_android_sources.py
      - name: Verify build162 DDNS click fix
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 162' app/build.gradle.kts
          grep -q 'versionName = "0.10.20"' app/build.gradle.kts
          grep -q 'androidx.compose.ui.window.Dialog(' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'Modifier.weight(1f).clickable(onClick=onEdit)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -q 'PremiumCard(accent,Modifier.clickable(onClick=onEdit))' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
      - name: Build signed release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleRelease --stacktrace --console=plain
      - name: Inspect signed APK
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          if not apk.exists():
              raise SystemExit(f'missing signed APK: {apk}')
          with zipfile.ZipFile(apk) as archive:
              dex = b''.join(archive.read(name) for name in archive.namelist() if name.startswith('classes') and name.endswith('.dex'))
          forbidden = (
              '状态闭环与后台任务',
              '终端历史与映射持久化',
              'PremiumCard(accent,Modifier.clickable(onClick=onEdit))',
          )
          required = (
              'DDNS 页面点击闪退修复',
              'DDNS 与证书',
              '更多操作',
              '/api/realtime/ws',
              '实时同步正常',
          )
          for value in forbidden:
              if value.encode('utf-8') in dex:
                  raise SystemExit(f'forbidden signed APK string remains: {value}')
          for value in required:
              if value.encode('utf-8') not in dex:
                  raise SystemExit(f'required signed APK string missing: {value}')
          print('signed build162 APK verified')
          PY
      - name: Verify release APK exists
        run: ls -lh app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.20-build162-release-apk
          path: app/build/outputs/apk/release/app-release.apk
