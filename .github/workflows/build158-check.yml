name: Build 158 Repository Check

on:
  push:
    branches:
      - build158
  workflow_dispatch:

concurrency:
  group: build158-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Prepare generated sources
        shell: bash
        run: |
          set -e
          rm -rf app/src/main/java
          python3 scripts/prepare_android_sources.py

      - name: Verify repository and UI invariants
        shell: bash
        run: python3 scripts/verify_build154_sources.py

      - name: Compile debug and release variants
        shell: bash
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > /tmp/build158-gradle.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            grep -nE '(^e: |\.kt:[0-9]+:[0-9]+|error:)' /tmp/build158-gradle.log | tail -n 300 || true
            tail -n 200 /tmp/build158-gradle.log
          else
            tail -n 100 /tmp/build158-gradle.log
          fi
          exit $STATUS

      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build158-generated-sources
          path: app/src/main/kotlin
          if-no-files-found: error

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build158-gradle-log
          path: /tmp/build158-gradle.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.16-build158-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.16-build158-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
