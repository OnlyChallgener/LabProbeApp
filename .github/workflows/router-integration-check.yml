name: Router Integration Check

on:
  push:
    branches:
      - build152
      - build160
      - build161
      - build162
      - build163
      - codex/router-control-v01011-build141
    paths:
      - app/build.gradle.kts
      - app/src/main/kotlin/com/labprobe/app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
      - .github/workflows/android-release.yml
  pull_request:
    paths:
      - app/build.gradle.kts
      - app/src/main/kotlin/com/labprobe/app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
      - .github/workflows/android-release.yml
  workflow_dispatch:

concurrency:
  group: router-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish CI start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/router-integration-stage',
              description: 'workflow started; preparing build165 sources',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare final Android sources once
        id: prepare
        run: python3 scripts/prepare_android_sources_build165.py
      - name: Verify build165 source invariants
        id: verify
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 165' app/build.gradle.kts
          grep -q 'versionName = "0.10.23"' app/build.gradle.kts
          grep -q 'NAT 诊断、Agent 更新与映射界面修复' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'requestAgentUpdateCheck()' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'agentUpdateUiError' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'item.route == "tool_ssh"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'Color(0xFFE9EDF3)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val thresholdPx = with(LocalDensity.current) { 72.dp.toPx() }' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val syncLabel = if (snapshot.source.startsWith("已同步")) "实时同步" else "本地缓存"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'kotlinx.coroutines.withTimeoutOrNull(2_500L)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'HealthCard(Modifier.clickable { onClick() })' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'NativeValueRow("最终响应", "已收到")' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'RoundedCornerShape(24.dp)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -q 'onClick = onEdit' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'DialogProperties(usePlatformDefaultWidth = false)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'fillMaxSize().statusBarsPadding().navigationBarsPadding().imePadding()' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false))' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          ! grep -q '来源：全部公网地址' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -q '检查失败：${it.message} · 已保留上次结果' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
      - name: Compile debug and release variants
        id: compile
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > /tmp/gradle-variants.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf '%s' 'Gradle/Kotlin compile failed' > /tmp/labprobe-ci-error.txt
            grep -nE '(^e: |\.kt:[0-9]+:[0-9]+|error:)' /tmp/gradle-variants.log | tail -n 280 || true
            tail -n 200 /tmp/gradle-variants.log
          else
            tail -n 100 /tmp/gradle-variants.log
          fi
          exit $STATUS
      - name: Inspect actual APK strings
        id: inspect_apk
        if: success()
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          required = [
              "NAT 诊断、Agent 更新与映射界面修复",
              "NAT 下拉菜单改为大圆角白色浮层",
              "NAT 任务完成后耗时和路由器响应停止累计",
              "Agent 更新检查改为 Hub 后台任务",
              "更新源暂不可用，Hub 已保留上次版本信息",
              "最终响应",
              "已收到",
              "/api/agent/update/check",
              "本地缓存",
              "设备、VPN 与 DDNS 今日变化",
              "devices_snapshot",
              "/api/realtime/ws",
              "/api/router/tasks/",
              "规则保存在 Hub 与 APP；Agent 离线不会删除设置",
          ]
          forbidden = [
              "来源：全部公网地址",
              "检查失败：HTTP 502: <!DOCTYPE html>",
              "终端卡片与 NAT 参数样式优化",
          ]
          for apk in (
              Path("app/build/outputs/apk/debug/app-debug.apk"),
              Path("app/build/outputs/apk/release/app-release-unsigned.apk"),
          ):
              if not apk.exists():
                  Path('/tmp/labprobe-ci-error.txt').write_text(f'missing APK: {apk}', encoding='utf-8')
                  raise SystemExit(f"missing APK: {apk}")
              with zipfile.ZipFile(apk) as archive:
                  dex = b"".join(
                      archive.read(name)
                      for name in archive.namelist()
                      if name.startswith("classes") and name.endswith(".dex")
                  )
              for value in forbidden:
                  if value.encode("utf-8") in dex:
                      raise SystemExit(f"forbidden APK string remains in {apk.name}: {value}")
              for value in required:
                  if value.encode("utf-8") not in dex:
                      raise SystemExit(f"required APK string missing in {apk.name}: {value}")
              print(f"verified actual DEX strings: {apk}")
          PY
      - name: Publish connector-readable CI stage
        if: always()
        uses: actions/github-script@v7
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          APK_OUTCOME: ${{ steps.inspect_apk.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcomes = {
              prepare: process.env.PREPARE_OUTCOME,
              verify: process.env.VERIFY_OUTCOME,
              compile: process.env.COMPILE_OUTCOME,
              apk: process.env.APK_OUTCOME,
            };
            const ok = Object.values(outcomes).every(value => value === 'success');
            let detail = Object.entries(outcomes).map(([key, value]) => `${key}=${value}`).join(' ');
            if (fs.existsSync('/tmp/labprobe-ci-error.txt')) {
              detail = fs.readFileSync('/tmp/labprobe-ci-error.txt', 'utf8').trim() || detail;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'labprobe/router-integration-stage',
              description: detail.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Upload diagnostics and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build165-integration-output
          path: |
            /tmp/gradle-variants.log
            /tmp/labprobe-ci-error.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
