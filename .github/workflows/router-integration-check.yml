name: Router Integration Check

on:
  push:
    branches: [build163]
    paths:
      - app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
  pull_request:
    paths:
      - app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
  workflow_dispatch:

concurrency:
  group: router-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare and verify build170 sources
        run: |
          python3 scripts/prepare_android_sources_build167.py
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 170' app/build.gradle.kts
          grep -q 'versionName = "0.10.28"' app/build.gradle.kts
          grep -q 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt
          grep -q 'StrictHostKeyChecking.*accept-new' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'previous?.close()' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt
          grep -q 'oldRejected && !candidateRejected' app/src/main/kotlin/com/labprobe/app/Ipv6Utils.kt
          grep -q '运行时间同步中' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/ic_launcher_logo.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Test and build Debug plus Release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          required = (
              "数据一致性与安全修复",
              "关注与离线列表统一按 MAC 使用同一份最新设备记录",
              "永久 IPv6 映射保留真实启动时间，缺失时不再显示 0 分",
              "SSH 密码迁移至 Android Keystore，并启用主机密钥校验",
              "运行时间同步中",
              "devices_snapshot",
              "/api/realtime/ws",
          )
          forbidden = (
              "来源：全部公网地址",
              "检查失败：HTTP 502: <!DOCTYPE html>",
          )
          apks = (
              Path("app/build/outputs/apk/debug/app-debug.apk"),
              Path("app/build/outputs/apk/release/app-release-unsigned.apk"),
          )
          for apk in apks:
              if not apk.is_file():
                  raise SystemExit(f"missing APK: {apk}")
              with zipfile.ZipFile(apk) as archive:
                  dex = b"".join(archive.read(name) for name in archive.namelist() if name.startswith("classes") and name.endswith(".dex"))
              for text in required:
                  if text.encode() not in dex:
                      raise SystemExit(f"missing from {apk.name}: {text}")
              for text in forbidden:
                  if text.encode() in dex:
                      raise SystemExit(f"forbidden in {apk.name}: {text}")
              print(f"verified {apk}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build170-integration-output
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
