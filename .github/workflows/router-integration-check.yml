name: Router Integration Check

on:
  push:
    branches:
      - build152
      - build160
      - build161
      - build162
      - build163
      - codex/router-control-v01011-build141
    paths:
      - app/build.gradle.kts
      - app/src/main/kotlin/com/labprobe/app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
      - .github/workflows/android-release.yml
  pull_request:
    paths:
      - app/build.gradle.kts
      - app/src/main/kotlin/com/labprobe/app/**
      - scripts/**
      - .github/workflows/router-integration-check.yml
      - .github/workflows/android-release.yml
  workflow_dispatch:

concurrency:
  group: router-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish CI start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/router-integration-stage',
              description: 'workflow started; preparing build163 sources',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare final Android sources once
        id: prepare
        run: python3 scripts/prepare_android_sources.py
      - name: Verify build163 terminal snapshot state
        id: verify
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 163' app/build.gradle.kts
          grep -q 'versionName = "0.10.21"' app/build.gradle.kts
          grep -q 'private val onDevicesSnapshot: (String) -> Unit = {}' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q '"devices_snapshot" -> if (data != null) onDevicesSnapshot(data.toString())' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q 'private fun acceptDevicesSnapshot(raw: String)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'lastDevicesSnapshotEpoch' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'root.optBoolean("confirmedEmpty", false)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'refreshOfflineDevices(offlineDevices + disappeared, fresh)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'persistCachesAsync()' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '终端列表五秒实时同步' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
      - name: Compile debug and release variants
        id: compile
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > /tmp/gradle-variants.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            printf '%s' 'Gradle/Kotlin compile failed' > /tmp/labprobe-ci-error.txt
            grep -nE '(^e: |\.kt:[0-9]+:[0-9]+|error:)' /tmp/gradle-variants.log | tail -n 280 || true
            tail -n 200 /tmp/gradle-variants.log
          else
            tail -n 100 /tmp/gradle-variants.log
          fi
          exit $STATUS
      - name: Inspect actual APK strings
        id: inspect_apk
        if: success()
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          forbidden = [
              "实时数据稍旧，等待 Agent 更新",
              "实时链路正在自动重连",
              "Waiting for Hub status",
              "Hub is online, but router data is unavailable",
              "Hub router data is available",
              "Hub 已连接，正在等待路由器实时数据",
              "路由器已连接，实时数据正常",
              "路由交互与状态回归修复",
              "统一路由数据源与无感预加载",
              "路由控制队列与可靠指令",
              "状态闭环与后台任务",
              "终端历史与映射持久化",
              "DDNS 页面点击闪退修复",
          ]
          required = [
              "终端列表五秒实时同步",
              "devices_snapshot",
              "实时链路已连接，等待首帧数据",
              "实时链路恢复中，已保留上次数据",
              "检测已由 Hub 接管，可以安全离开页面",
              "规则保存在 Hub 与 APP；Agent 离线不会删除设置",
              "更多操作",
              "/api/realtime/ws",
              "/api/router/tasks/",
              "DDNS 与证书",
              "映射与 UPnP",
              "防火墙",
              "网络自检",
              "路由 NAT 诊断",
              "Beta 在线升级",
              "实时同步正常",
          ]
          for apk in (
              Path("app/build/outputs/apk/debug/app-debug.apk"),
              Path("app/build/outputs/apk/release/app-release-unsigned.apk"),
          ):
              if not apk.exists():
                  Path('/tmp/labprobe-ci-error.txt').write_text(f'missing APK: {apk}', encoding='utf-8')
                  raise SystemExit(f"missing APK: {apk}")
              with zipfile.ZipFile(apk) as archive:
                  dex = b"".join(
                      archive.read(name)
                      for name in archive.namelist()
                      if name.startswith("classes") and name.endswith(".dex")
                  )
              for value in forbidden:
                  if value.encode("utf-8") in dex:
                      raise SystemExit(f"forbidden APK string remains in {apk.name}: {value}")
              for value in required:
                  if value.encode("utf-8") not in dex:
                      raise SystemExit(f"required APK string missing in {apk.name}: {value}")
              print(f"verified actual DEX strings: {apk}")
          PY
      - name: Publish connector-readable CI stage
        if: always()
        uses: actions/github-script@v7
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          APK_OUTCOME: ${{ steps.inspect_apk.outcome }}
        with:
          script: |
            const fs = require('fs');
            const stages = `prepare=${process.env.PREPARE_OUTCOME} verify=${process.env.VERIFY_OUTCOME} compile=${process.env.COMPILE_OUTCOME} apk=${process.env.APK_OUTCOME}`;
            const ok = [process.env.PREPARE_OUTCOME, process.env.VERIFY_OUTCOME, process.env.COMPILE_OUTCOME, process.env.APK_OUTCOME]
              .every(value => value === 'success');
            let detail = stages;
            if (fs.existsSync('/tmp/labprobe-ci-error.txt')) {
              detail = fs.readFileSync('/tmp/labprobe-ci-error.txt', 'utf8').trim() || stages;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'labprobe/router-integration-stage',
              description: detail.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Upload diagnostics and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build163-integration-output
          path: |
            /tmp/gradle-variants.log
            /tmp/labprobe-ci-error.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
