name: One-off build181 UI fix

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-ui-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0

      - name: Finish embedded mapping and rounded tab surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace(path, old, new, count=1):
              text = read(path)
              found = text.count(old)
              if found != count:
                  raise RuntimeError(f'{path}: expected {count} matches, found {found}: {old[:120]!r}')
              write(path, text.replace(old, new, count))

          # Proper embedded mode for IPv6 mapping. This removes the old -62dp
          # clipping hack instead of compensating it with more padding.
          p = 'app/src/main/kotlin/com/labprobe/app/MainActivity.kt'
          replace(
              p,
              '''fun DetailShell(
              title: String,
              subtitle: String,
              onBack: () -> Unit,
              compactHeader: Boolean = false,
              unifiedTypography: Boolean = false,
              content: @Composable ColumnScope.() -> Unit
          ) {''',
              '''fun DetailShell(
              title: String,
              subtitle: String,
              onBack: () -> Unit,
              compactHeader: Boolean = false,
              unifiedTypography: Boolean = false,
              showHeader: Boolean = true,
              content: @Composable ColumnScope.() -> Unit
          ) {'''
          )
          replace(
              p,
              '''    ) {
                  CompactPageHeader(
                      title = title,
                      subtitle = subtitle,
                      onBack = onBack,
                      compactTitle = compactHeader,
                      titleStyle = LabTypography.PageTitle.takeIf { unifiedTypography },
                      subtitleStyle = LabTypography.Supporting.takeIf { unifiedTypography }
                  )
                  content()
                  Spacer(Modifier.height(2.dp))
              }
          }

          @Composable
          fun OneUiTopNav''',
              '''    ) {
                  if (showHeader) {
                      CompactPageHeader(
                          title = title,
                          subtitle = subtitle,
                          onBack = onBack,
                          compactTitle = compactHeader,
                          titleStyle = LabTypography.PageTitle.takeIf { unifiedTypography },
                          subtitleStyle = LabTypography.Supporting.takeIf { unifiedTypography }
                      )
                  }
                  content()
                  Spacer(Modifier.height(2.dp))
              }
          }

          @Composable
          fun OneUiTopNav'''
          )

          # Global top navigation: pale-blue rounded selected state, no gray
          # rectangular elevation block.
          old_nav = '''                val itemShape = RoundedCornerShape(12.dp)
                          val itemModifier = Modifier
                              .height(36.dp)
                              .weight(1f)
                              .then(
                                  if (active) Modifier.shadow(
                                      elevation = 2.dp,
                                      shape = itemShape,
                                      clip = false,
                                      ambientColor = LabV2.ShadowAmbient,
                                      spotColor = LabV2.ShadowSpot
                                  ) else Modifier
                              )
                          Surface(
                              onClick = { onSelect(i) },
                              shape = itemShape,
                              color = if (active) Color(0xFFF8FBFF) else Color.Transparent,
                              shadowElevation = 0.dp,
                              border = if (active) androidx.compose.foundation.BorderStroke(1.dp, techBlue.copy(alpha = .14f)) else null,
                              modifier = itemModifier
                          ) {'''
          new_nav = '''                val itemShape = RoundedCornerShape(14.dp)
                          Surface(
                              onClick = { onSelect(i) },
                              shape = itemShape,
                              color = if (active) Color(0xFFE8F1FF) else Color.Transparent,
                              tonalElevation = 0.dp,
                              shadowElevation = 0.dp,
                              border = if (active) androidx.compose.foundation.BorderStroke(1.dp, techBlue.copy(alpha = .12f)) else null,
                              modifier = Modifier.height(36.dp).weight(1f)
                          ) {'''
          replace(p, old_nav, new_nav)

          # Port mapping can now render as an embedded pager page without its
          # own header, while standalone navigation remains unchanged.
          p = 'app/src/main/kotlin/com/labprobe/app/PortMapping.kt'
          replace(
              p,
              'fun PortMappingScreen(prefs: AppPrefs, onBack: () -> Unit) {',
              'fun PortMappingScreen(prefs: AppPrefs, onBack: () -> Unit, embedded: Boolean = false) {'
          )
          replace(
              p,
              'DetailShell("端口映射", "IPv6 入口 · Rust 四层反代 · 6→4 / 6→6", onBack, unifiedTypography = true) {',
              'DetailShell("端口映射", "IPv6 入口 · Rust 四层反代 · 6→4 / 6→6", onBack, unifiedTypography = true, showHeader = !embedded) {'
          )

          p = 'app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt'
          replace(
              p,
              '''@Composable
          private fun LegacyIpv6MappingPage(prefs: AppPrefs, onBack: () -> Unit) {
              Box(Modifier.fillMaxSize().clipToBounds()) {
                  Box(Modifier.fillMaxSize().offset(y = (-62).dp)) {
                      PortMappingScreen(prefs = prefs, onBack = onBack)
                  }
              }
          }''',
              '''@Composable
          private fun LegacyIpv6MappingPage(prefs: AppPrefs, onBack: () -> Unit) {
              PortMappingScreen(prefs = prefs, onBack = onBack, embedded = true)
          }'''
          )
          replace(
              p,
              '''@Composable
          private fun RouterSuiteTabs(selected: Int, onSelect: (Int) -> Unit) {
              val titles = listOf("IPv6映射", "端口映射", "UPnP")
              Row(Modifier.fillMaxWidth().height(36.dp).padding(horizontal = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                  titles.forEachIndexed { index, title ->
                      Box(Modifier.weight(1f).fillMaxHeight().clickable { onSelect(index) }, contentAlignment = Alignment.Center) {
                          Text(title, fontSize = LabTypography.Value.fontSize, fontWeight = if (selected == index) FontWeight.SemiBold else FontWeight.SemiBold, color = if (selected == index) RouterBlue else RouterMuted)
                          if (selected == index) Box(Modifier.align(Alignment.BottomCenter).width(30.dp).height(2.2.dp).background(RouterBlue, RoundedCornerShape(99.dp)))
                      }
                  }
              }
          }''',
              '''@Composable
          private fun RouterSuiteTabs(selected: Int, onSelect: (Int) -> Unit) {
              val titles = listOf("IPv6映射", "端口映射", "UPnP")
              Row(
                  Modifier.fillMaxWidth().height(42.dp).padding(horizontal = 12.dp, vertical = 3.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  titles.forEachIndexed { index, title ->
                      val active = selected == index
                      Surface(
                          onClick = { onSelect(index) },
                          modifier = Modifier.weight(1f).fillMaxHeight(),
                          shape = RoundedCornerShape(14.dp),
                          color = if (active) Color(0xFFE8F1FF) else Color.Transparent,
                          tonalElevation = 0.dp,
                          shadowElevation = 0.dp,
                          border = if (active) BorderStroke(1.dp, RouterBlue.copy(alpha = .12f)) else null
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Text(
                                  title,
                                  style = LabTypography.Value.copy(
                                      fontWeight = FontWeight.SemiBold,
                                      color = if (active) RouterBlue else RouterMuted
                                  ),
                                  maxLines = 1
                              )
                          }
                      }
                  }
              }
          }'''
          )

          # Core cards stay opaque white; only a very light rounded elevation.
          p = 'app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt'
          replace(p, 'shadowElevation = 2.dp\n    ) {\n        Column(', 'shadowElevation = 1.dp\n    ) {\n        Column(')

          print('embedded mapping and rounded tab patch applied')
          PY

          git diff --check
          git add app/src/main/kotlin/com/labprobe/app/MainActivity.kt \
                  app/src/main/kotlin/com/labprobe/app/PortMapping.kt \
                  app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt \
                  app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove mapping clipping and square tab feedback"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify source preparation is idempotent
        shell: bash
        run: |
          python3 scripts/prepare_android_sources_build167.py
          git diff --exit-code

      - name: Unit test and compile debug APK
        shell: bash
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Remove one-off workflow and publish validated fixes
        shell: bash
        run: |
          git rm .github/workflows/oneoff-build181-ui-fix.yml
          git commit -m "chore: remove one-off build181 UI workflow"
          git push origin HEAD:release/build180
