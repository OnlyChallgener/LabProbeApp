name: One-off build181 materialize and validate

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Materialize legacy source patches without regressing new UI
        shell: bash
        run: |
          set -e
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 scripts/prepare_android_sources_build167.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/kotlin/com/labprobe/app/MainActivity.kt').read_text(encoding='utf-8')
          port = Path('app/src/main/kotlin/com/labprobe/app/PortMapping.kt').read_text(encoding='utf-8')
          control = Path('app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt').read_text(encoding='utf-8')
          settings = Path('app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt').read_text(encoding='utf-8')
          native = Path('app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt').read_text(encoding='utf-8')
          access = Path('app/src/main/kotlin/com/labprobe/app/ServiceAccess.kt').read_text(encoding='utf-8')
          favorites = Path('app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt').read_text(encoding='utf-8')

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f'new UI/access regression after prepare: {label}')

          # Home row-click copy; no whole-card navigation and no trailing copy button.
          require(main, '.clickable(enabled = real.isNotBlank()) { copy(ctx, real) }', 'row click copy')
          row = main[main.index('fun HealthDataRowDisplay'):main.index('@Composable\nfun HealthExitCard')]
          if 'ContentCopy' in row or 'IconButton(' in row:
              raise SystemExit('new UI/access regression after prepare: trailing home copy icon returned')
          exit_card = main[main.index('fun HealthExitCard'):main.index('@Composable\nfun HealthVpnCard')]
          if 'HealthCard(Modifier.clip(HomeCardShape).clickable' in exit_card:
              raise SystemExit('new UI/access regression after prepare: exit card navigation returned')
          vpn_card = main[main.index('fun HealthVpnCard'):main.index('@Composable\nfun HealthDevicesCard')]
          if 'HealthCard(Modifier.clip(HomeCardShape).clickable' in vpn_card:
              raise SystemExit('new UI/access regression after prepare: VPN card navigation returned')

          require(main, 'val stroke = if (size > 100.dp) 12.dp.toPx() else 11.dp.toPx()', 'health score stroke')
          require(main, 'showHeader: Boolean = true', 'embedded DetailShell support')
          require(port, 'embedded: Boolean = false', 'embedded mapping mode')
          require(port, 'showHeader = !embedded', 'embedded mapping header suppression')
          if 'offset(y = (-62).dp)' in control:
              raise SystemExit('new UI/access regression after prepare: old -62dp clipping hack returned')
          require(control, 'PortMappingScreen(prefs = prefs, onBack = onBack, embedded = true)', 'embedded mapping page')
          require(control, 'Color(0xFFE8F1FF)', 'rounded pale-blue mapping tabs')

          # Requested icons and matched control widths.
          require(settings, 'icon = Icons.Rounded.CompareArrows', 'mapping bidirectional icon')
          if settings.count('Icons.Rounded.Bolt') < 2:
              raise SystemExit('new UI/access regression after prepare: dual lightning icon missing')
          require(native, 'Box(Modifier.weight(1.35f))', 'STUN server width')
          require(native, 'modifier = Modifier.weight(.85f)', 'STUN port width')
          require(native, 'label = "STUN 类型"', 'STUN type')
          require(native, 'label = "WAN 类型"', 'WAN type')

          # Browser opening remains user-controllable even if HTTPS fast probe is inconclusive.
          require(access, 'tcpReachableBeforeHttp', 'TCP-before-HTTPS probe')
          require(access, '可继续用浏览器尝试', 'HTTPS inconclusive message')
          require(favorites, '快速检测未确认，继续在浏览器尝试', 'browser fallback open')

          # Stronger Samsung-like shared typography.
          require(ui, 'fontSize = 16.sp', 'CardTitle 16sp')
          require(ui, 'val CardTitle = TextStyle(', 'CardTitle token')
          card = ui[ui.index('val CardTitle = TextStyle('):ui.index('val SectionTitle = TextStyle(')]
          if 'fontWeight = FontWeight.Bold' not in card:
              raise SystemExit('new UI/access regression after prepare: CardTitle is not Bold')

          print('new UI/access markers survived legacy source preparation')
          PY

          git add app scripts
          git commit -m "fix: materialize build181 release source state"

          # A second source preparation must be a strict no-op now.
          python3 scripts/prepare_android_sources_build167.py
          git diff --exit-code

      - name: Test and build debug APK
        shell: bash
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Clean one-off diagnostics and publish validated source state
        shell: bash
        run: |
          rm -f .build181-validation.txt .build181-prepare.diff .build181-materialize-failure.txt
          git rm -f .github/workflows/oneoff-build181-validation.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-validate.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-diagnose.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-prepdiff.yml 2>/dev/null || true
          git rm -f .github/workflows/oneoff-build181-materialize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove build181 one-off validation files"
          fi
          git push origin HEAD:release/build180
