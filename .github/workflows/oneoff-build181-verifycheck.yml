name: One-off build181 verifier check

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-verifycheck.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0
      - name: Check verifier after materialization
        shell: bash
        run: |
          set +e
          python3 scripts/prepare_android_sources_build167.py >/tmp/first.log 2>&1
          FIRST=$?
          git add app scripts
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m temp-materialized >/tmp/commit.log 2>&1
          python3 scripts/prepare_android_sources_build167.py >/tmp/second.log 2>&1
          SECOND=$?
          python3 scripts/verify_build154_sources.py >/tmp/verify.log 2>&1
          VERIFY=$?
          {
            echo "first=$FIRST"
            echo "second=$SECOND"
            echo "verify=$VERIFY"
            echo "verify_log:"
            tail -n 120 /tmp/verify.log
          } >/tmp/result
          git reset --hard origin/release/build180
          cp /tmp/result .build181-verify-check.txt
          git add .build181-verify-check.txt
          git commit -m "chore: record build181 verifier check"
          git push origin HEAD:release/build180
