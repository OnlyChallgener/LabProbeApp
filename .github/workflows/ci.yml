name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Validate repository source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          test -f README.md
          test -f app/build.gradle.kts
          test -f app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          test -f app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          test -f app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt
          test -f docs/AI_ASSISTANT_UI_CONSTRAINTS.md

          ROOT_MD=$(find . -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)
          if [ "$ROOT_MD" != "README.md" ]; then
            echo "Root documentation must be consolidated into README.md only." >&2
            printf '%s\n' "$ROOT_MD" >&2
            exit 1
          fi

          WORKFLOWS=$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          EXPECTED_WORKFLOWS=$(printf '%s\n' android-release.yml ci.yml test-bundle.yml)
          if [ "$WORKFLOWS" != "$EXPECTED_WORKFLOWS" ]; then
            echo "Only CI, Android Release and Test Bundle workflows are allowed." >&2
            printf '%s\n' "$WORKFLOWS" >&2
            exit 1
          fi

          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Validating LabProbe v${VERSION_NAME} build${VERSION_CODE}"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --force --no-tags origin main:refs/remotes/origin/main
            BASE_CODE=$(git show refs/remotes/origin/main:app/build.gradle.kts | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n1)
            BASE_NAME=$(git show refs/remotes/origin/main:app/build.gradle.kts | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n1)

            if [ "$VERSION_CODE" != "$BASE_CODE" ] || [ "$VERSION_NAME" != "$BASE_NAME" ]; then
              if [ "$VERSION_CODE" -le "$BASE_CODE" ]; then
                echo "PR versionCode must be greater than main: $BASE_CODE -> $VERSION_CODE" >&2
                exit 1
              fi

              if [ "$VERSION_NAME" = "$BASE_NAME" ]; then
                echo "versionName must change whenever versionCode changes for a formal release." >&2
                exit 1
              fi

              python3 - "$BASE_NAME" "$VERSION_NAME" <<'PY'
          import sys
          old = tuple(map(int, sys.argv[1].split('.')))
          new = tuple(map(int, sys.argv[2].split('.')))
          if not new > old:
              raise SystemExit(f'versionName must increase: {sys.argv[1]} -> {sys.argv[2]}')
          PY
            fi
          fi

          for workflow in .github/workflows/*.yml; do
            [ "$workflow" = ".github/workflows/ci.yml" ] && continue
            if grep --line-number --fixed-strings 'git push' "$workflow"; then
              echo "Workflow must not modify and push source code: $workflow" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/kotlin/com/labprobe/app/MainActivity.kt').read_text(encoding='utf-8')
          secure = Path('app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')

          assert 'diffie-hellman-group14-sha256,diffie-hellman-group14-sha1' in main
          assert 'cfg["StrictHostKeyChecking"]="ask"' in main
          assert 'diffie-hellman-group1-sha1' not in main
          assert '3des-cbc' not in main
          assert 'aes128-cbc' not in main
          assert 'SecureSshPasswordStore' in secure

          for heading in ('## 版本号规则', '## CI 与 Release', '## 标准发版流程', '## 固定签名'):
              assert heading in readme, f'missing README governance section: {heading}'
          PY

      - name: Prepare signing key for release test APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and Release compile
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed release test APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload release test APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-release-test-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
