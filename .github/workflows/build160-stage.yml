name: Build160 Stage

on:
  push:
    branches: [build160]
  pull_request:
    branches: [build159]
  workflow_dispatch:

concurrency:
  group: build160-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare generated sources
        run: python3 scripts/prepare_android_sources.py
      - name: Verify state and task invariants
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 160' app/build.gradle.kts
          grep -q 'versionName = "0.10.18"' app/build.gradle.kts
          grep -q 'SERVER_FRAME_TIMEOUT_MS = 45_000L' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q 'onTaskUpdate: (String) -> Unit' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q 'onAgentUpdate: (String) -> Unit' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q '/api/router/tasks/$kind' app/src/main/kotlin/com/labprobe/app/RouterTaskRepository.kt
          grep -q 'class AgentPresenceStore' app/src/main/kotlin/com/labprobe/app/AgentPresenceStore.kt
          grep -q 'realtimeDataFresh by mutableStateOf(false)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '检测已由 Hub 接管，可以安全离开页面' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'Agent 状态稍旧' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          ! grep -q 'state.hubConnected -> "实时同步正常"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'color = if (state.mqttConnected) LabV2.Green' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q 'while (running && isActive)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          ! grep -q 'PortAmber' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
      - name: Compile debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Upload generated sources
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build160-generated-sources
          path: app/src/main/kotlin/com/labprobe/app
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.18-build160-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.18-build160-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
