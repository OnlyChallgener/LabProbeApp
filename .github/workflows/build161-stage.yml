name: Build161 Stage

on:
  push:
    branches: [build161]
  pull_request:
    branches: [build160]
  workflow_dispatch:

concurrency:
  group: build161-stage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Java sources
        run: rm -rf app/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Prepare generated sources
        run: python3 scripts/prepare_android_sources.py
      - name: Verify history and mapping persistence invariants
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 161' app/build.gradle.kts
          grep -q 'versionName = "0.10.19"' app/build.gradle.kts
          grep -q 'object PortMappingRuleStore' app/src/main/kotlin/com/labprobe/app/PortMappingRuleStore.kt
          grep -q 'PortMappingRuleStore.load(context, prefs)' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'explicitNewerEmpty' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'Hub 本次未返回规则，已保留 APP 中的映射设置' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q '规则保存在 Hub 与 APP；Agent 离线不会删除设置' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'rulesLoaded = root.optBoolean("rulesLoaded", false)' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          ! grep -q 'val (newRules, newAgent) = api.list()' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
      - name: Compile debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.19-build161-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.19-build161-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build161-generated-sources
          path: app/src/main/kotlin/com/labprobe/app
