name: Fix codex UI compile

on:
  push:
    branches:
      - codex/ui

permissions:
  contents: write

jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codex/ui
        uses: actions/checkout@v4
        with:
          ref: codex/ui
          fetch-depth: 0

      - name: Patch invalid composable try-catch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/labprobe/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          state_line = '    var initError by remember { mutableStateOf<String?>(null) }\n'
          if text.count(state_line) != 1:
              raise SystemExit(f'Expected exactly one initError state line, found {text.count(state_line)}')
          text = text.replace(state_line, '', 1)

          old = '''    } else {
              try {
                  WifiRoamingTool(prefs)
              } catch (t: Throwable) {
                  initError = t.javaClass.simpleName + (t.message?.let { ": $it" } ?: "")
                  ExpressiveCard("漫游测试初始化失败", initError ?: "未知错误", Icons.Rounded.ErrorOutline, Color(0xFFEF4444)) {
                      Text(
                          "页面已拦截异常，未让 APP 直接闪退。请把该错误信息发我继续定位。",
                          fontSize = 12.sp,
                          fontWeight = FontWeight.SemiBold,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = .66f),
                          lineHeight = 17.sp
                      )
                      Spacer(Modifier.height(8.dp))
                      Button(onClick = { ready = false; initError = null }, shape = RoundedCornerShape(16.dp)) {
                          Text("重新初始化")
                      }
                  }
              }
          }
          '''
          new = '''    } else {
              WifiRoamingTool(prefs)
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one invalid composable try/catch block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove legacy Java sources
        shell: bash
        run: rm -rf app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
          cache-read-only: true

      - name: Prepare fixed signing key
        shell: bash
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Commit verified fix to codex/ui
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-codex-ui.yml
          git add app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          git commit -m "fix: compile wifi roaming screen"
          git push origin HEAD:codex/ui
