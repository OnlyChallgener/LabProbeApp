name: Build168 Stage

on:
  push:
    branches: [build163]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare build168 sources
        run: python3 scripts/prepare_android_sources_build167.py
      - name: Verify version and revision guards
        run: |
          grep -q 'versionCode = 168' app/build.gradle.kts
          grep -q 'versionName = "0.10.26"' app/build.gradle.kts
          grep -q 'sourceIsCurrent = snapshot.revision >= snapshotRevision' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'agentRevision' app/src/main/kotlin/com/labprobe/app/AgentPresenceStore.kt
      - name: Build debug and release
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Inspect APK contents
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.labprobe.app' versionCode='168' versionName='0.10.26'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.26-build168-debug
          path: app/build/outputs/apk/debug/app-debug.apk
