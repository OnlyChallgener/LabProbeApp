name: Android Release APK Build167

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"
      - name: Prepare build167 sources
        run: python3 scripts/prepare_android_sources_build167.py
      - name: Build signed release APK
        env:
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:assembleRelease --stacktrace --console=plain
      - name: Validate signed APK content
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 102400
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.labprobe.app' versionCode='167' versionName='0.10.25'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" LabProbe-v0.10.25-build167-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.25-build167-release-apk
          path: LabProbe-v0.10.25-build167-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.25-build167
          name: LabProbe v0.10.25 build167
          generate_release_notes: true
          files: LabProbe-v0.10.25-build167-release.apk
