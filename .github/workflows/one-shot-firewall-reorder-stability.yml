name: One-shot firewall reorder stability fix

on:
  push:
    branches:
      - fix/firewall-reorder-stability-01072
    paths:
      - .github/workflows/one-shot-firewall-reorder-stability.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firewall-reorder-stability-01072
          fetch-depth: 0

      - name: Apply reorder state and native-scope fix
        shell: bash
        env:
          PATCH_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          patch = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          namespace = {}
          exec(compile(patch, '<firewall-reorder-patch>', 'exec'), namespace, namespace)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate and compile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          gradle :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace --console=plain

      - name: Commit focused APP fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          git commit -m "fix(app): stabilize firewall drag reorder"
          git push origin HEAD:fix/firewall-reorder-stability-01072
