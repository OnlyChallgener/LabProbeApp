name: Build 159 Router Control Check

on:
  push:
    branches:
      - build159
  workflow_dispatch:

concurrency:
  group: build159-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'labprobe/build159-stage',
              description: 'Router command lifecycle and UI checks are running',
              target_url
            })

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Prepare generated sources
        shell: bash
        run: |
          set -e
          rm -rf app/src/main/java
          python3 scripts/prepare_android_sources.py

      - name: Verify router command and UI invariants
        shell: bash
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -F 'versionCode = 159' app/build.gradle.kts
          grep -F 'versionName = "0.10.17"' app/build.gradle.kts
          grep -F 'val commandScope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt
          grep -F 'withTimeout(45_000L)' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt
          grep -F '.readTimeout(45, TimeUnit.SECONDS)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -F 'executeCommand { api.setUpnp(enabled, wan) }' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt
          grep -F 'repository.refreshUpnp(false)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -F '设置正在后台应用，页面可以安全退出' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -F 'modifier = Modifier.fillMaxWidth().height(44.dp).nativeBlueShadow' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          ! grep -F 'Modifier.width(158.dp).height(44.dp).nativeBlueShadow' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          ! grep -F 'repository.refreshUpnp(true)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          ! grep -F 'withTimeout(12_000L)' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt
          ! grep -F 'withTimeout(25_000L)' app/src/main/kotlin/com/labprobe/app/RouterRepository.kt

      - name: Compile debug and release variants
        shell: bash
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > /tmp/build159-gradle.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            grep -nE '(^e: |\.kt:[0-9]+:[0-9]+|error:)' /tmp/build159-gradle.log | tail -n 300 || true
            tail -n 200 /tmp/build159-gradle.log
          else
            tail -n 100 /tmp/build159-gradle.log
          fi
          exit $STATUS

      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build159-generated-sources
          path: app/src/main/kotlin
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-build159-diagnostics
          path: |
            /tmp/labprobe-ci-error.txt
            /tmp/build159-gradle.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.17-build159-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.17-build159-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure'
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'labprobe/build159-stage',
              description: state === 'success' ? 'build159 router control and APK checks passed' : 'build159 router control or APK checks failed',
              target_url
            })
