name: One-shot package APP 0.10.75 zip

on:
  push:
    branches:
      - fix/tcp-extreme-01075
    paths:
      - .github/workflows/one-shot-package-01075-zip.yml

permissions:
  contents: write

env:
  TAG: test-bundle/20260902-eweb-keepalive
  APK: LabProbe-v0.10.75-build230-test.apk
  ZIP: LabProbe-v0.10.75-build230-test.zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tcp-extreme-01075
          fetch-depth: 0

      - name: Download existing test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "$APK" --dir /tmp/labprobe
          test -s "/tmp/labprobe/$APK"

      - name: Create zip package
        run: |
          set -euo pipefail
          cd /tmp/labprobe
          zip -0 "$ZIP" "$APK"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.75-build230-test-zip
          path: |
            /tmp/labprobe/${{ env.ZIP }}
            /tmp/labprobe/${{ env.ZIP }}.sha256
          compression-level: 0
          retention-days: 7

      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-package-01075-zip.yml
          git commit -m "chore: remove one-shot APP zip packager"
          git push origin HEAD:fix/tcp-extreme-01075
