name: Apply build186 visual hierarchy polish

on:
  push:
    branches: [release/build180]
    paths: ['.github/workflows/apply-build186-ui-polish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n == 0:
                  raise SystemExit(f'missing marker in {path}: {old[:100]!r}')
              if count is not None and n != count:
                  raise SystemExit(f'unexpected marker count in {path}: got {n}, expected {count}: {old[:100]!r}')
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print(f'{path}: replaced {n} occurrence(s)')

          # 1) Stronger launcher depth: brighter top-left glow, deeper lower-right tone,
          #    plus a soft glossy sweep so the icon no longer reads as a flat cyan tile.
          Path('app/src/main/res/drawable/ic_launcher_background.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0H108V108H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="5" android:startY="3" android:endX="104" android:endY="106" android:type="linear">
                          <item android:color="#FF94F1E8" android:offset="0" />
                          <item android:color="#FF63DDD9" android:offset="0.30" />
                          <item android:color="#FF35BDC9" android:offset="0.66" />
                          <item android:color="#FF168BAE" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0H108V108H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:centerX="26" android:centerY="20" android:gradientRadius="82" android:type="radial">
                          <item android:color="#68FFFFFF" android:offset="0" />
                          <item android:color="#28FFFFFF" android:offset="0.38" />
                          <item android:color="#08FFFFFF" android:offset="0.70" />
                          <item android:color="#00FFFFFF" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0H108V36C82,52 35,58 0,38Z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="8" android:startY="4" android:endX="84" android:endY="55" android:type="linear">
                          <item android:color="#36FFFFFF" android:offset="0" />
                          <item android:color="#16FFFFFF" android:offset="0.48" />
                          <item android:color="#00FFFFFF" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0H108V108H0Z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:centerX="104" android:centerY="104" android:gradientRadius="72" android:type="radial">
                          <item android:color="#26004D70" android:offset="0" />
                          <item android:color="#0E004D70" android:offset="0.46" />
                          <item android:color="#00004D70" android:offset="1" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          ''', encoding='utf-8')

          # 2) Typography: home/card titles must visually lead content.
          ui = 'app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt'
          replace(ui,
              'val CardTitle = TextStyle(\n        fontFamily = FontFamily.Default,\n        fontSize = 15.sp,\n        lineHeight = 20.sp,\n        fontWeight = FontWeight.Bold,',
              'val CardTitle = TextStyle(\n        fontFamily = FontFamily.Default,\n        fontSize = 15.sp,\n        lineHeight = 20.sp,\n        fontWeight = FontWeight.ExtraBold,', 1)
          replace(ui,
              '.background(accent.copy(alpha = .10f))\n                    .border(1.dp, accent.copy(alpha = .08f), RoundedCornerShape(14.dp)),',
              '.shadow(5.dp, RoundedCornerShape(14.dp), clip = false, ambientColor = accent.copy(alpha = .14f), spotColor = accent.copy(alpha = .20f))\n                    .background(Brush.linearGradient(listOf(Color.White.copy(alpha = .96f), accent.copy(alpha = .22f), accent.copy(alpha = .07f))))\n                    .border(1.dp, Color.White.copy(alpha = .90f), RoundedCornerShape(14.dp)),', 1)

          main = 'app/src/main/kotlin/com/labprobe/app/MainActivity.kt'
          replace(main,
              'Modifier.size(36.dp).clip(HomeInnerShape).background(accent.copy(alpha = .12f))',
              'Modifier.size(36.dp).shadow(5.dp, HomeInnerShape, clip = false, ambientColor = accent.copy(alpha = .14f), spotColor = accent.copy(alpha = .20f)).clip(HomeInnerShape).background(Brush.linearGradient(listOf(Color.White.copy(alpha = .96f), accent.copy(alpha = .22f), accent.copy(alpha = .07f))))')
          replace(main,
              'Text(title, fontSize = LabTypography.Value.fontSize, fontWeight = FontWeight.SemiBold, color = LabV2.Ink, maxLines = 1)',
              'Text(title, fontSize = LabTypography.Value.fontSize, fontWeight = FontWeight.Bold, color = Color(0xFF0B1320), maxLines = 1)', 1)
          replace(main,
              'Text(title, style = LabTypography.CardTitle, maxLines = 2, overflow = TextOverflow.Clip)',
              'Text(title, style = LabTypography.CardTitle.copy(color = Color(0xFF0B1320), fontWeight = FontWeight.ExtraBold), maxLines = 2, overflow = TextOverflow.Clip)', 1)
          replace(main,
              'fontWeight = FontWeight.SemiBold,\n                            color = LabV2.Ink,\n                            maxLines = 1,\n                            softWrap = false,',
              'fontWeight = FontWeight.ExtraBold,\n                            color = Color(0xFF0B1320),\n                            maxLines = 1,\n                            softWrap = false,', 1)
          replace(main,
              '.background(LabV2.Cyan.copy(alpha = .12f))\n                    .clickable { onTogglePrivacy() },',
              '.shadow(5.dp, HomeInnerShape, clip = false, ambientColor = LabV2.Cyan.copy(alpha = .14f), spotColor = LabV2.Cyan.copy(alpha = .20f))\n                    .background(Brush.linearGradient(listOf(Color.White.copy(alpha = .96f), LabV2.Cyan.copy(alpha = .22f), LabV2.Cyan.copy(alpha = .07f))))\n                    .clickable { onTogglePrivacy() },', 1)
          replace(main,
              'Text("VPN / STUN 地址", style = LabTypography.CardTitle.copy(color = LabV2.Ink), maxLines = 1, overflow = TextOverflow.Ellipsis)',
              'Text("VPN / STUN 地址", style = LabTypography.CardTitle.copy(color = Color(0xFF0B1320), fontWeight = FontWeight.ExtraBold), maxLines = 1, overflow = TextOverflow.Ellipsis)', 1)

          # 3) Remove the last visible purple WOL header/button.
          wol = 'app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt'
          p = Path(wol)
          s = p.read_text(encoding='utf-8')
          n = s.count('Color(0xFF8B5CF6)')
          if n < 2:
              raise SystemExit(f'expected at least 2 WOL purple markers, got {n}')
          s = s.replace('Color(0xFF8B5CF6)', 'LabV2.Cyan')
          # Give the WOL header icon a lit gradient tile too.
          old = 'Box(Modifier.size(38.dp).clip(RoundedCornerShape(14.dp)).background(LabV2.Cyan.copy(alpha = .11f)), contentAlignment = Alignment.Center) {'
          new = 'Box(Modifier.size(38.dp).clip(RoundedCornerShape(14.dp)).background(androidx.compose.ui.graphics.Brush.linearGradient(listOf(Color.White.copy(alpha = .96f), LabV2.Cyan.copy(alpha = .22f), LabV2.Cyan.copy(alpha = .07f)))), contentAlignment = Alignment.Center) {'
          if old not in s:
              raise SystemExit('missing WOL icon tile marker')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4/5) NAT hierarchy + alignment.
          native = 'app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt'
          replace(native,
              'border = BorderStroke(1.dp, NativeBlue.copy(alpha = .32f))\n                    ) {\n                        Icon(Icons.Rounded.Dns, null, Modifier.size(16.dp), tint = NativeBlue)',
              'border = BorderStroke(1.dp, NativeBlue.copy(alpha = .32f)),\n                        contentPadding = PaddingValues(horizontal = 13.dp, vertical = 0.dp)\n                    ) {\n                        Icon(Icons.Rounded.Dns, null, Modifier.size(16.dp), tint = NativeBlue)', 1)
          replace(native,
              'Text(server, style = LabTypography.ValueStrong.copy(color = NativeInk), maxLines = 2, overflow = TextOverflow.Clip)',
              'Text(server, style = LabTypography.ValueStrong.copy(color = NativeInk), maxLines = 1, overflow = TextOverflow.Ellipsis)', 1)
          replace(native,
              'Text(value, fontSize = LabTypography.SectionTitle.fontSize, lineHeight = LabTypography.SectionTitle.lineHeight, color = NativeInk, fontWeight = FontWeight.SemiBold, maxLines = 1)',
              'Text(value, style = LabTypography.ValueStrong.copy(color = NativeInk), maxLines = 1, overflow = TextOverflow.Ellipsis)', 1)
          replace(native,
              'Box(Modifier.size(34.dp).background(color.copy(alpha = .10f), RoundedCornerShape(12.dp)), contentAlignment = Alignment.Center) {\n            Icon(icon, null, Modifier.size(19.dp), tint = color)\n        }\n        Spacer(Modifier.width(9.dp))\n        Text(title, fontSize = LabTypography.SectionTitle.fontSize, fontWeight = FontWeight.SemiBold, color = NativeInk)',
              'Box(Modifier.size(34.dp).shadow(5.dp, RoundedCornerShape(12.dp), clip = false, ambientColor = color.copy(alpha = .14f), spotColor = color.copy(alpha = .20f)).background(androidx.compose.ui.graphics.Brush.linearGradient(listOf(Color.White.copy(alpha = .96f), color.copy(alpha = .22f), color.copy(alpha = .07f))), RoundedCornerShape(12.dp)), contentAlignment = Alignment.Center) {\n            Icon(icon, null, Modifier.size(19.dp), tint = color)\n        }\n        Spacer(Modifier.width(9.dp))\n        Text(title, style = LabTypography.CardTitle.copy(color = NativeInk, fontWeight = FontWeight.ExtraBold))', 1)
          replace(native,
              'Text(value, Modifier.weight(1f), style = LabTypography.Value.copy(color = NativeInk), maxLines = 3, overflow = TextOverflow.Clip)',
              'Text(value, Modifier.weight(1f), style = LabTypography.Value.copy(color = NativeInk, fontWeight = FontWeight.SemiBold), maxLines = 3, overflow = TextOverflow.Clip)', 1)
          replace(native,
              'fontSize = LabTypography.Supporting.fontSize,\n                            fontWeight = FontWeight.SemiBold,\n                            color = NativeInk,',
              'fontSize = LabTypography.Value.fontSize,\n                            lineHeight = LabTypography.Value.lineHeight,\n                            fontWeight = FontWeight.Bold,\n                            color = NativeInk,', 1)

          # build186
          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'versionCode = 185' not in g:
              raise SystemExit('versionCode 185 marker missing')
          g = g.replace('versionCode = 185', 'versionCode = 186', 1)
          gradle.write_text(g, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'versionCode = 186' app/build.gradle.kts
          ! grep -Fq 'Color(0xFF8B5CF6)' app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt
          grep -Fq 'contentPadding = PaddingValues(horizontal = 13.dp, vertical = 0.dp)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'LabTypography.CardTitle.copy(color = NativeInk, fontWeight = FontWeight.ExtraBold)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq '#FF94F1E8' app/src/main/res/drawable/ic_launcher_background.xml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/kotlin/com/labprobe/app/MainActivity.kt app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt app/src/main/res/drawable/ic_launcher_background.xml
          git commit -m 'fix: visual hierarchy and launcher depth for build186'
          git push origin HEAD:release/build180
