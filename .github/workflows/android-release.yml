name: Android Release APK

on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"
      - name: Prepare and verify build172
        run: |
          python3 -m py_compile scripts/apply_build172_agent_icon_fixes.py
          python3 scripts/prepare_android_sources_build167.py
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 172' app/build.gradle.kts
          grep -q 'versionName = "0.10.30"' app/build.gradle.kts
          grep -q 'Relay 更新与启动图标修复' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'AgentUpdateCoordinator.bind(prefs)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'AgentUpdateCoordinator.check(prefs, silent = true)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'AgentUpdateCoordinator.state.collectAsState()' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'var cleanupBusy by remember' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'val agentBusy = agentUpdateUi.busy || cleanupBusy' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'onClick = { AgentUpdateCoordinator.update(prefs) }' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'SupervisorJob() + Dispatchers.Main.immediate' app/src/main/kotlin/com/labprobe/app/AgentUpdateCoordinator.kt
          grep -q 'STATUS_REFRESH_INTERVAL_MS = 15_000L' app/src/main/kotlin/com/labprobe/app/AgentUpdateCoordinator.kt
          grep -q 'private var monitorJob: Job?' app/src/main/kotlin/com/labprobe/app/AgentUpdateCoordinator.kt
          grep -q 'repeat(120)' app/src/main/kotlin/com/labprobe/app/AgentUpdateCoordinator.kt
          grep -q 'agentVersionAtLeast' app/src/main/kotlin/com/labprobe/app/AgentUpdateCoordinator.kt
          grep -q '"offline" -> state.offlineDevices' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt
          ! grep -q 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'oldRejected && !candidateRejected' app/src/main/kotlin/com/labprobe/app/Ipv6Utils.kt
          grep -q '运行时间同步中' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q '@drawable/ic_launcher_background' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_launcher_background' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q '<layer-list' app/src/main/res/drawable/ic_launcher_foreground.xml
          ! grep -q 'android:insetLeft' app/src/main/res/drawable/ic_launcher_foreground.xml
          ! grep -q 'M1179 556.339' app/src/main/res/drawable/ic_launcher_logo.xml
          grep -q 'android:scaleX="0.84"' app/src/main/res/drawable/ic_launcher_logo.xml
          grep -q 'M0,0H108V108H0Z' app/src/main/res/drawable/ic_launcher_background.xml
      - name: Test and build signed APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain
      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='172' versionName='0.10.30'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          with zipfile.ZipFile(apk) as archive:
              dex = b"".join(archive.read(name) for name in archive.namelist() if name.startswith("classes") and name.endswith(".dex"))
          for text in (
              "Relay 更新与启动图标修复",
              "启动图标拆分为全幅渐变背景和透明网络前景，清除四周脏边",
              "Relay 版本检查与更新任务移到应用级作用域，离开页面仍会继续",
              "更新后持续监测 Agent 心跳，版本号和最后上报时间自动刷新",
              "Relay 已更新到",
              "当前已是最新版本",
              "运行时间同步中",
          ):
              if text.encode() not in dex:
                  raise SystemExit(f"missing signed APK content: {text}")
          print("signed build172 APK verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.30-build172-release-apk
          path: app/build/outputs/apk/release/app-release.apk
