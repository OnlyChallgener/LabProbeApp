name: Android Release APK

on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"
      - name: Prepare and verify build171
        run: |
          python3 scripts/prepare_android_sources_build167.py
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 171' app/build.gradle.kts
          grep -q 'versionName = "0.10.29"' app/build.gradle.kts
          grep -q '图标与设备数据回归修复' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'mergeSharedDeviceState(state.devices + state.offlineDevices, state.onlineDevices)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '"offline" -> state.offlineDevices' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q '"offline" -> shared.filterNot' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'map\[key\] = if (old == null) device else mergePreferFreshDevice(old, device)' app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt
          grep -q 'old.followedOverride == true || fresh.followedOverride == true' app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt
          grep -q 'remark = old.remark.ifBlank { fresh.remark }' app/src/main/kotlin/com/labprobe/app/WolManagementPanel.kt
          grep -q 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt
          ! grep -q 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -q '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q 'oldRejected && !candidateRejected' app/src/main/kotlin/com/labprobe/app/Ipv6Utils.kt
          grep -q '运行时间同步中' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q '@drawable/ic_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'android:insetLeft="20dp"' app/src/main/res/drawable/ic_launcher_foreground.xml
      - name: Test and build signed APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain
      - name: Verify signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='171' versionName='0.10.29'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          with zipfile.ZipFile(apk) as archive:
              dex = b"".join(archive.read(name) for name in archive.namelist() if name.startswith("classes") and name.endswith(".dex"))
          for text in (
              "图标与设备数据回归修复",
              "启动图标加入自适应安全边距，顶部和两侧网络节点完整显示",
              "离线列表保持独立权威数据，关注列表只引用在线或离线最新记录",
              "永久 IPv6 映射保留真实启动时间，缺失时不再显示 0 分",
              "SSH 密码迁移至 Android Keystore，并启用主机密钥校验",
              "运行时间同步中",
          ):
              if text.encode() not in dex:
                  raise SystemExit(f"missing signed APK content: {text}")
          print("signed build171 APK verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.29-build171-release-apk
          path: app/build/outputs/apk/release/app-release.apk
