name: Android Release APK
# v0.10.42 / build188 requested-only polish release pipeline. retry-1

on:
  workflow_dispatch:
  push:
    branches:
      - release/build180
    paths:
      - '.github/workflows/android-release.yml'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply build188 requested-only polish
        run: |
          set -euo pipefail
          python3 scripts/apply_build188_requested_polish.py

      - name: Persist build188 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/kotlin/com/labprobe/app/MainActivity.kt \
            app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt \
            app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt \
            app/src/main/res/drawable/labprobe_launcher_noglow.xml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: requested-only polish for build188'
            git push origin HEAD:release/build180
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Verify v0.10.42 build188 source
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 188' app/build.gradle.kts
          grep -Fq 'versionName = "0.10.42"' app/build.gradle.kts

          # Existing security / stability behavior must remain untouched.
          grep -Fq 'diffie-hellman-group14-sha256,diffie-hellman-group14-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'cfg["StrictHostKeyChecking"]="ask"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'aes128-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'AgentUpdateCoordinator.bind(prefs)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt

          # Prior build187 requested changes remain.
          grep -Fq 'ambientColor = LabV2.ShadowAmbient.copy(alpha = .85f)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq '.combinedClickable(onClick = onOpenDetails, onLongClick = onOpenDetails)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'settingsMint = Color(0xFF28BFA3)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'sectionGap = 6.dp' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -Fq 'private fun NativeAnalysisValueRow' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt

          # build188: only the four explicitly requested adjustments.
          grep -Fq 'android:icon="@drawable/labprobe_launcher_noglow"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/labprobe_launcher_noglow"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/labprobe_launcher_noglow.xml
          grep -Fq 'android:startColor="#1785B8"' app/src/main/res/drawable/labprobe_launcher_noglow.xml
          grep -Fq 'android:endColor="#2FD0B7"' app/src/main/res/drawable/labprobe_launcher_noglow.xml
          ! grep -Fq 'labprobe_launcher_1024' app/src/main/AndroidManifest.xml

          grep -Fq 'padding(top = if (index == 0) 6.dp else 4.dp, bottom = 4.dp)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'style = LabTypography.Value.copy(color = NativeMuted, fontWeight = FontWeight.Medium)' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt

          test "$(grep -Fc 'fontSize = LabTypography.SectionTitle.fontSize' app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt)" -ge 2
          test "$(grep -Fc 'lineHeight = LabTypography.SectionTitle.lineHeight' app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt)" -ge 2

          grep -Fq 'verticalArrangement = Arrangement.spacedBy(1.5.dp)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt

          git diff --check
          echo 'v0.10.42 build188 source verification passed'

      - name: Test and build signed Release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='188' versionName='0.10.42'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo 'signed v0.10.42 build188 APK verified'

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.42-build188-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.10.42-build188'
          APK='app/build/outputs/apk/release/app-release.apk'
          ASSET='LabProbe-v0.10.42-build188-release.apk'
          cp "$APK" "$RUNNER_TEMP/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --target 'release/build180' \
              --title '极客网探 v0.10.42 build188' \
              --notes 'build188 仅处理本轮 4 项：启动图标改为无右上光晕的蓝绿雷达网络矢量图；NAT 最近检测标题与内容间距轻微增加、第二行内容字号对齐分析结果；路由设置指定卡片标题小一号；记录页事件列表卡片间距从 3dp 减半到 1.5dp。其他功能、页面、UI 与字体未改。'
          fi
