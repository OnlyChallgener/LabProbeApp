name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-build*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Verify mainline release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual build from branch: $GITHUB_REF_NAME"

            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "Main release validation enabled."
            else
              echo "Non-main branch build: skip production release validation."
            fi
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_SHA"; then
              echo "Release tag must point to a commit that belongs to main history." >&2
              exit 1
            fi
          fi

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          RELEASE_TAG="v${VERSION_NAME}-build${VERSION_CODE}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match source version $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Verify release source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/kotlin/com/labprobe/app/MainActivity.kt').read_text(encoding='utf-8')
          fav = Path('app/src/main/kotlin/com/labprobe/app/FavoriteShortcuts.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt').read_text(encoding='utf-8')
          secure = Path('app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt').read_text(encoding='utf-8')
          assistant = Path('app/src/main/kotlin/com/labprobe/app/feature/assistant/AiScreens.kt').read_text(encoding='utf-8')

          required_main = [
              'diffie-hellman-group14-sha256,diffie-hellman-group14-sha1',
              'cfg["StrictHostKeyChecking"]="ask"',
              'AgentUpdateCoordinator.bind(prefs)',
              'setPrimaryClip(ClipData.newPlainText("极客网探", text))',
              'toast(ctx, "已复制")',
              'AiFloatingPet { onNavigate("ai_settings") }',
              'Text("AI 助手"',
              'Text("配置 DeepSeek API"',
          ]
          for needle in required_main:
              assert needle in main, f'missing MainActivity invariant: {needle}'
          for forbidden in ('diffie-hellman-group1-sha1', '3des-cbc', 'aes128-cbc'):
              assert forbidden not in main, f'forbidden SSH fallback restored: {forbidden}'
          assert 'SecureSshPasswordStore' in secure
          assert 'fun AppPrefs.syncHomeVpnFavoriteShortcuts(rows: List<Pair<String, String>>): Int {' in fav
          assert 'remoteEndpoint = wanUrl' in fav
          assert 'val backgroundAlpha = if (muted) .07f else .12f' in ui
          assert 'fun AiFloatingPet(onOpen: () -> Unit)' in assistant
          assert 'if (expanded) onOpen() else expanded = true' in assistant
          PY
          git diff --check

      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed Release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as archive:
              dex = b''.join(
                  archive.read(name)
                  for name in archive.namelist()
                  if name.startswith('classes') and name.endswith('.dex')
              )

          for marker in (b'AiFloatingPet', b'AiSettingsScreen', b'ai_settings', b'deepseek-v4-flash'):
              assert marker in dex, f'AI assistant missing from packaged APK: {marker.decode()}'
          print('AI assistant package verification passed.')
          PY
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          ASSET="LabProbe-v${VERSION_NAME}-build${VERSION_CODE}-release.apk"
          cp "$APK" "$RUNNER_TEMP/$ASSET"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$ASSET" \
              --target "$GITHUB_SHA" \
              --title "极客网探 v${VERSION_NAME} build${VERSION_CODE}" \
              --generate-notes
          fi
