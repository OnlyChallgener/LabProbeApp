name: Android Release APK
# v0.10.42 / build187 targeted UI polish release pipeline.

on:
  workflow_dispatch:
  push:
    branches:
      - release/build180
    paths:
      - '.github/workflows/android-release.yml'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply build187 targeted UI polish
        run: |
          set -euo pipefail
          python3 scripts/apply_build187_targeted_ui_polish.py

      - name: Persist build187 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/kotlin/com/labprobe/app/MainActivity.kt \
            app/src/main/kotlin/com/labprobe/app/PortMapping.kt \
            app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt \
            app/src/main/res/drawable-nodpi/labprobe_launcher_1024.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix: targeted UI polish for build187'
            git push origin HEAD:release/build180
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Verify v0.10.42 build187 source
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 187' app/build.gradle.kts
          grep -Fq 'versionName = "0.10.42"' app/build.gradle.kts

          # Security / stability fixes retained.
          grep -Fq 'diffie-hellman-group14-sha256,diffie-hellman-group14-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'cfg["StrictHostKeyChecking"]="ask"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'aes128-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'fun deviceDisplayName(device: DeviceItem)' app/src/main/kotlin/com/labprobe/app/DeviceDisplayName.kt
          grep -Fq 'AgentUpdateCoordinator.bind(prefs)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt

          # Previous UI fixes retained.
          grep -Fq 'HomeMiniMetric = Metric.copy(fontSize = 22.sp, lineHeight = 25.sp, fontWeight = FontWeight.ExtraBold)' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          grep -Fq 'fontFamily = FontFamily.Default' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          ! grep -Fq 'FontFamily.SansSerif' app/src/main/kotlin/com/labprobe/app/ui/design/LabUiV2.kt
          ! grep -Fq 'Color(0xFF7C3AED)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'leadingIcon = Icons.Rounded.Tune' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'NativeFirmwareVersionRow(info.current.ifBlank { "--" })' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq '"connection closed" in lower' app/src/main/kotlin/com/labprobe/app/UiMessageZh.kt

          # build187 requested-only changes.
          grep -Fq 'android:icon="@drawable/labprobe_launcher_1024"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/labprobe_launcher_1024"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/labprobe_launcher_1024.png
          grep -Fq 'ambientColor = LabV2.ShadowAmbient.copy(alpha = .85f)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'modifier = Modifier.shadow(' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'verticalArrangement = Arrangement.spacedBy(3.dp)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'settingsMint = Color(0xFF28BFA3)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'sectionGap = 6.dp' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -Fq 'titleStyleOverride = LabTypography.CardTitle' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -Fq 'fontSize = 12.5.sp, lineHeight = 16.sp' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -Fq 'private fun NativeAnalysisValueRow' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'NativeAnalysisValueRow("检测状态"' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt
          grep -Fq 'NativeAnalysisValueRow("NAT类型"' app/src/main/kotlin/com/labprobe/app/RouterNativeToolsUi.kt

          git diff --check
          echo 'v0.10.42 build187 source verification passed'

      - name: Test and build signed Release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='187' versionName='0.10.42'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo 'signed v0.10.42 build187 APK verified'

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.42-build187-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.10.42-build187'
          APK='app/build/outputs/apk/release/app-release.apk'
          ASSET='LabProbe-v0.10.42-build187-release.apk'
          cp "$APK" "$RUNNER_TEMP/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --target 'release/build180' \
              --title '极客网探 v0.10.42 build187' \
              --notes 'build187：切换为此前生成的 1024 图标；首页与设备页卡片增强悬浮层级；IPv6 映射详情字号与空白收紧；端口映射列表空白收紧；路由 NAT 分析结果改为黑体标题+淡色同字号内容；记录页卡片间距减半；设置页三个按钮统一薄荷绿。其他功能、页面和全局字体未改。已通过单元测试、Release 编译与 APK 签名校验。'
          fi
