name: Android Release APK

on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove legacy Java sources
        shell: bash
        run: rm -rf app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Prepare fixed signing key
        shell: bash
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$LABPROBE_KEYSTORE_BASE64" ]; then
            echo "::error::LABPROBE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Prepare final Android sources once
        shell: bash
        run: |
          set -e
          python3 scripts/prepare_android_sources.py

      - name: Verify build162 DDNS editor and field compatibility
        shell: bash
        run: |
          set -e
          python3 scripts/verify_build154_sources.py
          grep -q 'versionCode = 162' app/build.gradle.kts
          grep -q 'versionName = "0.10.20"' app/build.gradle.kts
          grep -q 'SERVER_FRAME_TIMEOUT_MS = 45_000L' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q 'onTaskUpdate: (String) -> Unit' app/src/main/kotlin/com/labprobe/app/HubMqttClient.kt
          grep -q '/api/router/tasks/$kind' app/src/main/kotlin/com/labprobe/app/RouterTaskRepository.kt
          grep -q 'realtimeDataFresh by mutableStateOf(false)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -q '检测已由 Hub 接管，可以安全离开页面' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'PortMappingRuleStore.load(context, prefs)' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'explicitNewerEmpty' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q '规则保存在 Hub 与 APP；Agent 离线不会删除设置' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          grep -q 'androidx.compose.ui.window.Dialog(' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'val normalizedInitial=remember(initial)' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q '未识别服务商' app/src/main/kotlin/com/labprobe/app/RouterControlUi.kt
          grep -q 'private fun JSONObject.ddnsText' app/src/main/kotlin/com/labprobe/app/RouterControlApi.kt
          grep -q 'private fun JSONObject.ddnsFlag' app/src/main/kotlin/com/labprobe/app/RouterControlApi.kt
          ! grep -q 'state.hubConnected -> "实时同步正常"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt

      - name: Build signed release APK
        shell: bash
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace --console=plain > /tmp/gradle-build.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "===== Kotlin/compiler errors ====="
            grep -nE '(^e: |\.kt:[0-9]+:[0-9]+|error:)' /tmp/gradle-build.log | tail -n 260 || true
            echo "===== Gradle tail ====="
            tail -n 180 /tmp/gradle-build.log
          else
            tail -n 100 /tmp/gradle-build.log
          fi
          exit $STATUS

      - name: Inspect actual signed APK strings
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/release/app-release.apk")
          if not apk.exists():
              raise SystemExit(f"missing signed APK: {apk}")
          with zipfile.ZipFile(apk) as archive:
              dex = b"".join(
                  archive.read(name)
                  for name in archive.namelist()
                  if name.startswith("classes") and name.endswith(".dex")
              )

          forbidden = (
              "实时数据稍旧，等待 Agent 更新",
              "实时链路正在自动重连",
              "Waiting for Hub status",
              "Hub is online, but router data is unavailable",
              "Hub router data is available",
              "路由器已连接，实时数据正常",
              "Hub 已连接，正在等待路由器实时数据",
              "路由交互与状态回归修复",
              "统一路由数据源与无感预加载",
              "路由控制队列与可靠指令",
              "状态闭环与后台任务",
              "终端历史与映射持久化",
          )
          required = (
              "DDNS 页面点击闪退修复",
              "更多操作",
              "未识别服务商",
              "DDNS 设置未生效，请稍后重试",
              "实时链路已连接，等待首帧数据",
              "实时链路恢复中，已保留上次数据",
              "实时数据暂时未更新，已保留上次结果",
              "检测已由 Hub 接管，可以安全离开页面",
              "Hub 正在提交 NAT 检测任务",
              "显示上次检查快照 · 仅手动检测",
              "设置正在后台应用，页面可以安全退出",
              "Hub 本次未返回规则，已保留 APP 中的映射设置",
              "映射状态暂未同步，已保留全部设置",
              "规则保存在 Hub 与 APP；Agent 离线不会删除设置",
              "STUN 类型",
              "WAN 类型",
              "/api/realtime/ws",
              "/api/router/tasks/",
              "temperature2gC",
              "temperature5gC",
              "storagePercent",
              "DDNS 与证书",
              "路由设置",
              "映射与 UPnP",
              "防火墙",
              "网络自检",
              "路由 NAT 诊断",
              "Beta 在线升级",
              "实时同步正常",
          )
          for value in forbidden:
              if value.encode("utf-8") in dex:
                  raise SystemExit(f"forbidden signed APK string remains: {value}")
          for value in required:
              if value.encode("utf-8") not in dex:
                  raise SystemExit(f"required signed APK string missing: {value}")
          print("signed build162 APK DEX strings verified")
          PY

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-ddns-build162-gradle-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Verify release APK exists
        shell: bash
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -e
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v${{ steps.app_version.outputs.version_name }}-build${{ steps.app_version.outputs.version_code }}-release-apk
          path: app/build/outputs/apk/release/app-release.apk
