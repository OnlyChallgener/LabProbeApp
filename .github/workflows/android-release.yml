name: Android Release APK
# v0.10.42 / build191 requested-only polish release pipeline.

on:
  workflow_dispatch:
  push:
    branches:
      - release/build180
    paths:
      - '.github/workflows/android-release.yml'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply build191 requested-only polish
        run: |
          set -euo pipefail
          python3 scripts/apply_build191_requested_polish.py

      - name: Persist build191 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle.kts \
            app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: requested-only polish for build191'
            git push origin HEAD:release/build180
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare signing key
        env:
          LABPROBE_KEYSTORE_BASE64: ${{ secrets.LABPROBE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LABPROBE_KEYSTORE_BASE64"
          printf '%s' "$LABPROBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/labprobe-release.jks"
          echo "LABPROBE_KEYSTORE_PATH=$RUNNER_TEMP/labprobe-release.jks" >> "$GITHUB_ENV"

      - name: Verify v0.10.42 build191 source
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 191' app/build.gradle.kts
          grep -Fq 'versionName = "0.10.42"' app/build.gradle.kts

          # Existing security / stability behavior must remain untouched.
          grep -Fq 'diffie-hellman-group14-sha256,diffie-hellman-group14-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'cfg["StrictHostKeyChecking"]="ask"' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'diffie-hellman-group1-sha1' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq '3des-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          ! grep -Fq 'aes128-cbc' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'AgentUpdateCoordinator.bind(prefs)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'SecureSshPasswordStore' app/src/main/kotlin/com/labprobe/app/SecureTokenStore.kt

          # Prior requested UI changes remain.
          grep -Fq 'ambientColor = LabV2.ShadowAmbient.copy(alpha = .85f)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq '.combinedClickable(onClick = onOpenDetails, onLongClick = onOpenDetails)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'sectionGap = 6.dp' app/src/main/kotlin/com/labprobe/app/PortMapping.kt
          test "$(grep -Fc 'fontSize = LabTypography.SectionTitle.fontSize' app/src/main/kotlin/com/labprobe/app/RouterSettingsUi.kt)" -ge 2
          grep -Fq 'android:icon="@drawable/labprobe_launcher_noglow"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/labprobe_launcher_noglow"' app/src/main/AndroidManifest.xml
          grep -Fq 'settingsMint = Color(0xFF10A9C8)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'verticalArrangement = Arrangement.spacedBy(0.75.dp)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'Box(Modifier.fillMaxWidth().heightIn(min = 56.dp)) {' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'if (index > 0) Spacer(Modifier.height(3.dp))' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'if (idx != rows.lastIndex) Spacer(Modifier.height(6.dp))' app/src/main/kotlin/com/labprobe/app/MainActivity.kt

          # build191: exactly this round's two adjustments.
          ! grep -Fq "fontFamily = if (shown.contains(':') || shown.count { it == '.' } >= 2) FontFamily.Monospace else FontFamily.Default" app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'style = LabTypography.ValueStrong.copy(' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'fontFamily = FontFamily.Default' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {' app/src/main/kotlin/com/labprobe/app/MainActivity.kt
          grep -Fq 'Text(deviceDisplayName(d)' app/src/main/kotlin/com/labprobe/app/MainActivity.kt

          git diff --check
          echo 'v0.10.42 build191 source verification passed'

      - name: Test and build signed Release APK
        env:
          LABPROBE_KEYSTORE_PATH: ${{ env.LABPROBE_KEYSTORE_PATH }}
          LABPROBE_KEYSTORE_PASSWORD: ${{ secrets.LABPROBE_KEYSTORE_PASSWORD }}
          LABPROBE_KEY_ALIAS: ${{ secrets.LABPROBE_KEY_ALIAS }}
          LABPROBE_KEY_PASSWORD: ${{ secrets.LABPROBE_KEY_PASSWORD }}
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='191' versionName='0.10.42'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo 'signed v0.10.42 build191 APK verified'

      - uses: actions/upload-artifact@v4
        with:
          name: LabProbe-v0.10.42-build191-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.10.42-build191'
          APK='app/build/outputs/apk/release/app-release.apk'
          ASSET='LabProbe-v0.10.42-build191-release.apk'
          cp "$APK" "$RUNNER_TEMP/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --target 'release/build180' \
              --title '极客网探 v0.10.42 build191' \
              --notes 'build191 仅处理本轮 2 项：首页出口与路由、VPN/STUN 等地址值取消 IP 专用等宽字体，统一回默认系统字体，保持字号/粗细/颜色与换行不变；首页关注终端三行信息增加 2dp 行间距，缓解过度紧凑。其他功能、UI 与字体未改。'
          fi
