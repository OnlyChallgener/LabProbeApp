name: One-off build181 validation

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Verify source prepare is idempotent
        run: |
          python3 scripts/prepare_android_sources_build167.py
          git diff --exit-code
      - name: Test and build debug APK
        env:
          LABPROBE_SKIP_SOURCE_PREPARE: '1'
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain
      - name: Remove validation workflow
        run: |
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-build181-validate.yml
          git commit -m "chore: remove one-off build181 validation workflow"
          git push origin HEAD:release/build180
