name: One-shot TCP peak extreme 0.10.72

on:
  push:
    branches:
      - codex/stabilize-ai-assistant-20260901
    paths:
      - .github/workflows/one-shot-tcp-peak-extreme-01072.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stabilize-ai-assistant-20260901
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply focused source patch
        run: python3 scripts/one_shot_tcp_peak_extreme_01072.py

      - name: Test models and compile Kotlin
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.labprobe.app.TcpPeakModelsTest
          ./gradlew compileDebugKotlin

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/kotlin/com/labprobe/app/TcpPeakModels.kt app/src/main/kotlin/com/labprobe/app/TcpPeakConnections.kt app/src/main/kotlin/com/labprobe/app/MainActivity.kt app/src/test/kotlin/com/labprobe/app/TcpPeakModelsTest.kt
          git diff --cached --check
          git commit -m 'feat(tcp-peak): add Relay extreme mode'
          git push origin HEAD:codex/stabilize-ai-assistant-20260901
