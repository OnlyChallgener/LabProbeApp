name: One-off build181 diagnose

on:
  push:
    branches:
      - release/build180
    paths:
      - .github/workflows/oneoff-build181-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/build180
          fetch-depth: 0
      - name: Diagnose source preparation
        shell: bash
        run: |
          set +e
          python3 scripts/prepare_android_sources_build167.py > /tmp/prepare.log 2>&1
          RC=$?
          {
            echo "prepare_rc=$RC"
            if git diff --quiet; then
              echo "prepare_diff=clean"
            else
              echo "prepare_diff=dirty"
              echo "changed_files:"
              git diff --name-only
              echo "diff_stat:"
              git diff --stat
            fi
            echo "prepare_log:"
            tail -n 120 /tmp/prepare.log
          } > .build181-validation.txt
          git restore . ':!.build181-validation.txt' 2>/dev/null || true
          git config user.name "OpenAI UI Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build181-validation.txt
          git commit -m "chore: record build181 validation diagnosis"
          git push origin HEAD:release/build180
