<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>

.row{display:flex;align-items:center;gap:8px}

.drag-slot{border:1px dashed #bce6e6;border-radius:20px;background:#e9f5f7;margin-bottom:12px}
.dragging{user-select:none;-webkit-user-select:none}
