<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--bg:#101923;--teal:#25bcbf;--line:#2a3444;--muted:#90949d}
* {-webkit-tap-highlight-color:transparent!important;box-sizing:border-box;outline:none!important}
body{margin:0;background:var(--bg);color:#f8f9fc;font:14px -apple-system,BlinkMacSystemFont,Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select{font:inherit;color:inherit;background:transparent;border:0}
button{cursor:pointer}
main{padding:0 12px 18px;min-height:100vh;position:relative}

/* Scanning View (图1/图3) */
.scanning-page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 60px}
.radar-box{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.radar-circuits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;animation:circuit-breathe 2.4s ease-in-out infinite}
@keyframes circuit-breathe{0%,100%{opacity:0.26;filter:drop-shadow(0 0 0 rgba(37,188,191,0))}50%{opacity:0.95;filter:drop-shadow(0 0 5px rgba(37,188,191,0.85))}}
.radar-orbit-arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;animation:spin-arc 2.2s linear infinite}
@keyframes spin-arc{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.radar-orb{width:130px;height:130px;object-fit:contain;position:relative;z-index:5;border-radius:50%;box-shadow:0 0 35px rgba(37,188,191,0.3);animation:orb-float 2.8s ease-in-out infinite}
@keyframes orb-float{0%,100%{transform:translateY(0) scale(0.99)}50%{transform:translateY(-4px) scale(1.01)}}
.scan-msg{font-size:16px;color:#fff;margin-top:28px;font-weight:400;letter-spacing:0.4px}
.scan-sub{font-size:13px;color:#8f95a0;margin-top:8px;letter-spacing:0.2px}

/* Result View (图4) */
.result-page{display:block}
.stamp{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11.5px;color:#9aa0ad;padding:4px 0 6px;min-height:26px}
.stamp button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;color:var(--teal)}
.stamp svg{width:16px;height:16px;display:block}
.stamp .spinning svg{animation:spin 1s linear infinite}
.tabs{display:flex;justify-content:space-around;gap:8px}
.tabs button{flex:1;padding:6px 0 10px;font-size:13px;position:relative;white-space:nowrap}
.tabs .active{color:var(--teal);font-weight:500}
.tabs .active:after{content:'';position:absolute;width:34px;height:2px;background:var(--teal);bottom:3px;left:50%;transform:translateX(-50%);border-radius:2px}
.panel{border:1px solid var(--line);border-radius:14px;padding:0 10px;overflow:hidden}
.bands button{font-size:12px;padding:6px 0 8px}
.chips{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 6px;margin:2px 0 10px}
.chip{flex:1;min-width:0;height:28px;min-height:28px;border:1px solid currentColor;border-radius:14px;padding:0 6px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.chip .ssid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chip b{flex-shrink:0;width:16px;height:16px;border-radius:50%;background:currentColor;display:inline-flex;align-items:center;justify-content:center}
.chip b span{color:#fff;font-size:9px}
.choose{flex-shrink:0;width:22px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.choose:before{content:'⌄';color:#bbb;font-size:16px;line-height:1}
.choose select{position:absolute;inset:0;width:100%;opacity:0}
canvas{display:block;width:100%;height:220px}
.units{color:#b7b9bf;font-size:11px;margin-bottom:0}
.axis{display:grid;grid-template-columns:36px repeat(var(--columns),1fr);text-align:center;color:#747985;font-size:10px;row-gap:3px;margin:3px 0 12px}
.axis strong{font-weight:400;color:var(--teal)}
.wifi{display:flex;align-items:center;gap:8px;border-top:1px solid #232d3d;padding:8px 0}
.router-icon,.router-icon img{width:40px;height:38px;object-fit:contain;flex-shrink:0}
.router-icon{position:relative}
.router-icon .brand{position:absolute;width:18px;height:18px;right:0;bottom:0}
.info{flex:1;min-width:0;overflow:hidden}
.labels{display:flex;gap:3px;color:var(--teal);font-size:9.5px;align-items:center;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;line-height:1.2}
.labels .maker{max-width:54px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.tag{border:1px solid var(--teal);border-radius:2px;padding:0 2px;line-height:1.2;flex-shrink:0}
.name{font-size:13px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mac{font-size:10px;color:var(--muted)}
.level{min-width:46px;text-align:right;font-size:13px;flex-shrink:0}
.level small{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
.error{color:#f0a16d;font-size:12px;line-height:1.5;padding:10px 4px}
.hint{text-align:center;color:var(--muted);font-size:12px;padding:16px}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.signal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.signal-sheet{width:100%;max-width:480px;background:#141c26;border-radius:16px 16px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom));max-height:58vh;display:flex;flex-direction:column;box-sizing:border-box;box-shadow:0 -4px 30px rgba(0,0,0,0.6)}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;min-height:0;flex:1;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.signal-grid .chip{width:100%;height:30px;min-height:30px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;border-radius:15px;border:1px solid currentColor;font-size:11px;box-sizing:border-box;opacity:.45;background:transparent;transition:opacity .15s ease,background .15s ease;cursor:pointer}
.signal-grid .chip.active{opacity:1;background:color-mix(in srgb,currentColor 16%,transparent);font-weight:500}
.signal-grid .chip .ssid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.signal-grid .chip b{flex-shrink:0;width:15px;height:15px;border-radius:50%;background:currentColor;display:inline-flex;align-items:center;justify-content:center}
.signal-grid .chip b span{color:#fff;font-size:9px}
.signal-actions{display:flex;gap:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0}
.signal-actions button{flex:1;height:34px;border:1px solid var(--teal);border-radius:17px;color:var(--teal);font-size:12.5px;font-weight:500;background:transparent;cursor:pointer}
.signal-actions button.all{background:var(--teal);color:#fff}
</style><main>

'use strict';
const $=id=>document.getElementById(id),colors=['#25bcbf','#87b7ff','#d087ff','#f59150','#73e6a0','#eb68bd','#70d5f7','#8f95ff'];let serial=0,timer=null,started=0,polling=false,closed=false;
const pending=new Map(),state={value:null,view:'ssid',band:0,selected:null,busy:false};
const bands=[['2.4G','channel24Detail'],['5.2G','channel52Detail'],['5.8G','channel58Detail']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action){return new Promise((resolve,reject)=>{const key=String(++serial),deadline=setTimeout(()=>{pending.delete(key);reject(Error('连接超时，请重试'));},25000);pending.set(key,{resolve,reject,deadline});HubScan.request(key,action);});}
window.receive=(key,result)=>{const p=pending.get(key);if(!p)return;pending.delete(key);clearTimeout(p.deadline);result.ok?p.resolve(result.data):p.reject(Error(result.error||'扫描失败，请重试'));};
function detail(){return state.value?.[bands[state.band][1]]||{};}
function rows(){return (detail().channelSsidList||[]).filter(r=>Number.isFinite(Number(r.signal))&&Number(r.channel)>0).slice().sort((a,b)=>Number(!!b.isSelfSsid)-Number(!!a.isSelfSsid)||Number(b.signal)-Number(a.signal));}
function error(message){$('error').textContent=message||'';$('error').hidden=!message;}
function selectTabs(id,values,current,click){$(id).innerHTML=values.map(([k,label])=>`<button data-key="${esc(k)}" class="${String(k)===String(current)?'active':''}">${esc(label)}</button>`).join('');$(id).onclick=event=>{const b=event.target.closest('button');if(b)click(b.dataset.key);};}
function render(){

function closeSignals(){document.querySelector('.signal-mask')?.remove();}
function toggleSignal(ssid){if(state.selected===null)state.selected=new Set(rows().map(r=>r.ssid));state.selected.has(ssid)?state.selected.delete(ssid):state.selected.add(ssid);}
function openSignals(){closeSignals();const mask=document.createElement('div');mask.className='signal-mask';mask.innerHTML='<section class="signal-sheet"><div class="signal-grid"></div><div class="signal-actions"><button class="none">全部取消</button><button class="all">全部选择</button></div></section>';document.body.append(mask);const values=[...new Set(rows().map(r=>r.ssid))];function fill(){mask.querySelector('.signal-grid').innerHTML=values.map((ssid,i)=>`<button class="chip ${state.selected===null||state.selected.has(ssid)?'active':''}" style="color:${colors[i%colors.length]}" data-index="${i}"><span class="ssid">${esc(ssid||'隐藏信号')}</span><b><span>${rows().filter(r=>r.ssid===ssid).length}</span></b></button>`).join('');}fill();mask.onclick=e=>{if(e.target===mask){closeSignals();return;}const b=e.target.closest('[data-index]');if(b){toggleSignal(values[Number(b.dataset.index)]);fill();draw();}if(e.target.closest('.none')){state.selected=new Set();fill();draw();}if(e.target.closest('.all')){state.selected=null;fill();draw();}};}
function draw(){
  if(state.busy)return;
  const canvas=$('chart'),w=canvas.clientWidth,h=240,ratio=devicePixelRatio||1;canvas.width=Math.round(w*ratio);canvas.height=h*ratio;const c=canvas.getContext('2d');c.scale(ratio,ratio);const grid=detail().channelInterfere||[],list=rows(),pad=17,bottom=h-8,top=12;if(!grid.length||!w)return;const lo=Number(grid[0].channel),hi=Number(grid.at(-1).channel),x=v=>pad+(v-lo)/(Math.max(1,hi-lo))*(w-pad*2);
  const max=state.view==='index'?Math.max(1,...grid.map(r=>Number(r.botherIndex)||0)):100,y=v=>state.view==='ssid'?top+(-v/100)*(bottom-top):bottom-(v/max)*(bottom-top);c.font='11px sans-serif';c.setLineDash([3,2]);c.strokeStyle='#53545c';c.fillStyle='#b7b9bf';
  for(let i=0;i<=5;i++){const row=top+(bottom-top)*i/5;c.beginPath();c.moveTo(0,row);c.lineTo(w,row);c.stroke();c.fillText(state.view==='ssid'?String(-i*20):((5-i)*max/5).toFixed(1),0,Math.max(11,row-3));}c.setLineDash([]);
  if(state.view==='index'){grid.forEach(r=>{const width=Math.min(23,(w-2*pad)/grid.length*.6),v=Number(r.botherIndex)||0;c.fillStyle='#25bcbf';c.fillRect(x(Number(r.channel))-width/2,y(v),width,bottom-y(v));});return;}
  list.forEach((r,i)=>{const color=colors[i%colors.length],centre=Number(r.channel),widthMHz=2*Number(r.bandWidth||1)*(state.band===0?5:20),half=Math.max(2,widthMHz/10),signal=r.isSelfSsid?0:Number(r.signal);if(state.selected!==null&&!state.selected.has(r.ssid))return;c.globalAlpha=1;c.strokeStyle=color;c.lineWidth=r.isSelfSsid?1.5:1;c.beginPath();let begun=false;
  for(let step=0;step<=120;step++){const ch=lo+(hi-lo)*step/120,t=Math.max(0,1-((ch-centre)/half)**2),v=-100+(signal+100)*t;if(Math.abs(ch-centre)>half)continue;const a=x(ch),b=y(v);if(!begun){c.moveTo(a,b);begun=true;}else c.lineTo(a,b);}c.stroke();c.fillStyle=color;const label=(r.ssid||'隐藏信号')+(r.isSelfSsid?'(我家)':'');const textWidth=c.measureText(label).width;c.fillText(label,Math.max(0,Math.min(w-textWidth,x(centre)-textWidth/2)),Math.max(11,y(signal)-5));});c.globalAlpha=1;
}
function running(active){
  state.busy=active;clearTimeout(timer);
  if(active&&!started)started=Date.now();
  if(!active)started=0;
  render();
}
async function read(){
  if(polling||closed)return;polling=true;
  try{
    const value=await api('read');if(closed)return;state.value=value;
    if(value.scanError&&!value.inScan)throw Error(value.scanError);
    error('');
    if(value.inScan){
      running(true);
      timer=setTimeout(read,2000);
    }else{
      running(false);
    }
  }catch(e){
    error(e.message);
    running(false);
  }finally{
    polling=false;
  }
}
async function scan(){
  if(state.busy||closed)return;
  started=Date.now();
  running(true);
  error('');
  try{
    await api('start');
    if(!closed)timer=setTimeout(read,1500);
  }catch(e){
    error(e.message);
    running(false);
  }
}
window.start=cached=>{
  if(cached?.scanTime)state.value=cached;
  render();
  read();
};
$('rescan').onclick=scan;
window.addEventListener('resize',draw);
window.addEventListener('pagehide',()=>{closed=true;clearTimeout(timer);pending.forEach(p=>clearTimeout(p.deadline));pending.clear();});
</script></html>
