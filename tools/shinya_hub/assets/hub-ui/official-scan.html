<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>路由器扫描结果</title>
<script>
history.replaceState(null,'', '#/channelView?projectId='+encodeURIComponent(__HUB_PROJECT__)
  +'&sn='+encodeURIComponent(__HUB_SERIAL__)+'&token=hub-local');
const pending=new Map();let sequence=0;
window.HubScanRequest=function(action){return new Promise((resolve,reject)=>{
  const id=String(++sequence),timer=setTimeout(()=>{pending.delete(id);reject(new Error('扫描请求超时，请重试'));},65000);
  pending.set(id,{resolve,reject,timer});HubScan.request(id,action);
});};
window.receive=function(id,value){const p=pending.get(id);if(!p)return;
  clearTimeout(p.timer);pending.delete(id);
  if(value.ok)p.resolve({code:0,data:value.data});else p.reject(new Error(value.error||'扫描失败，请重试'));
};
</script>
